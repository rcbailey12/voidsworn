<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voidsworn: 3D battle prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1626; --iron:#182133; --iron2:#222d44; --iron3:#2d3a56;
  --bone:#e6dcc4; --bone2:#b3aa95; --bone3:#7d7768;
  --gilt:#d0a64b; --gilt2:#8c6d2c; --verd:#5fb3a6; --blood:#d0493f; --ember:#f0b35a;
  --glass:rgba(12,18,31,.80); --shield:#62ccff; --hull:#ffae42;
  --ui:"Barlow Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --gothic:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:#04060c;color:var(--bone);font-family:var(--ui);font-size:15px;line-height:1.4}
button{font-family:inherit;font-size:14px;color:var(--bone);background:rgba(34,45,68,.85);border:1px solid var(--iron3);padding:6px 12px;cursor:pointer;border-radius:4px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:var(--iron3);border-color:var(--gilt2)}
button:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gilt);color:#1c1405;border-color:var(--gilt);font-weight:700}
button.primary:hover:not(:disabled){background:#e2bb62}
button.on{border-color:var(--gilt2);color:var(--gilt)}
h1,h2,h3,h4{margin:0;font-weight:600}
.gothic{font-family:var(--gothic);font-weight:400}
.muted{color:var(--bone2)} .dim{color:var(--bone3)} .gilt{color:var(--gilt)} .verd{color:var(--verd)} .blood{color:#e27f74} .ember{color:var(--ember)}
.row{display:flex;gap:8px;align-items:center} .spacer{flex:1} .num{font-variant-numeric:tabular-nums}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--iron3);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--bone2);background:rgba(15,22,38,.6)}
.pill{display:inline-block;white-space:nowrap;font-size:12px;padding:0 7px;border:1px solid #2f6a62;color:var(--verd);border-radius:10px;margin:2px 4px 2px 0}

#stage{position:fixed;inset:0}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#plates{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hud{position:absolute;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(208,166,75,.2);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#btop{top:12px;left:12px;right:12px;height:52px;display:flex;align-items:center;gap:12px;padding:0 12px}
#btop .t{font-family:var(--gothic);font-size:28px;line-height:1}
#roster{top:76px;left:12px;width:236px;bottom:150px;overflow:auto;padding:8px}
#panel{top:76px;right:12px;width:340px;bottom:12px;overflow:auto;padding:14px}
#log{left:12px;bottom:12px;width:430px;height:126px;overflow:auto;padding:8px 12px;font-size:13.5px;line-height:1.45}
#log .p{color:var(--verd)} #log .e{color:#e27f74} #log .s{color:var(--gilt)} #log .x{color:var(--bone3)}
#camhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--bone2);padding:6px 12px;display:flex;gap:12px;white-space:nowrap}
.rcard{padding:7px 9px;border:1px solid transparent;border-radius:4px;cursor:pointer;margin-bottom:3px}
.rcard:hover{background:rgba(45,58,86,.55)}
.rcard.sel{border-color:var(--gilt);background:rgba(45,58,86,.55)}
.rcard.done{opacity:.5}
.rcard .n{font-weight:600;font-size:14.5px}
.rcard .c{font-size:12.5px;color:var(--bone2)}
.bar{height:5px;background:#3a1d1d;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hull)} .bar.low>i{background:#ff5a3c}
.sh4{display:flex;gap:3px;margin-top:4px} .sh4 span{flex:1;height:3px;background:var(--iron3);border-radius:2px} .sh4 span.on{background:var(--shield)}
#panel h3{font-size:21px} #panel .cls{color:var(--bone2);font-size:13.5px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px;margin:10px 0}
.stats b{font-weight:600;color:var(--bone2)}
.sect{margin-top:12px;border-top:1px solid rgba(45,58,86,.8);padding-top:10px}
.sect h4{margin:0 0 7px;font-size:14.5px;color:var(--gilt);font-weight:600}
.weap{display:grid;grid-template-columns:1fr auto;padding:6px 8px;border:1px solid var(--iron3);border-radius:4px;margin-bottom:5px;cursor:pointer;font-size:13.5px;background:rgba(34,45,68,.6)}
.weap:hover{border-color:var(--gilt2)} .weap.armed{border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)} .weap.off{opacity:.45;cursor:default}
.weap .wn{font-weight:600} .weap .wd{color:var(--bone2);font-size:12.5px;grid-column:1/-1}
.orders{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.orders button{font-size:13px;padding:5px 6px;text-align:left;line-height:1.2}
.orders button small{display:block;color:var(--bone2);font-size:11.5px}
.shielddial{display:flex;gap:12px;align-items:center}
.secs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;font-size:12px;color:var(--bone2)}
.secs span{display:block;margin-bottom:2px}
#resolvelbl{font-size:14px;letter-spacing:.05em}
.shv{color:var(--shield)} .hlv{color:var(--hull)}
.legend{font-size:12px;color:var(--bone3);margin-top:6px;line-height:1.35}
.plate.friend .nm{color:#8ff0a0} .plate.foe .nm{color:#ff8a80} .plate.flag .nm::before{content:'\2605  ';color:var(--gilt)}
.setpanel{position:absolute;top:58px;right:0;width:290px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:5} .setpanel .dim{grid-column:1/-1} .setpanel.hidden{display:none}
#btop{position:absolute;z-index:12}
.keys{font-size:12px;color:var(--bone3);margin-top:12px;line-height:1.9}
.tip{position:fixed;pointer-events:none;z-index:50;background:rgba(12,18,31,.96);border:1px solid var(--gilt2);padding:9px 11px;border-radius:5px;font-size:13.5px;max-width:330px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tip .h{font-weight:700;margin-bottom:3px} .tip table{border-collapse:collapse;width:100%} .tip td{padding:1px 6px 1px 0} .tip td.r{text-align:right;font-variant-numeric:tabular-nums}
.intro-on .hud:not(.endcard){display:none}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--gothic);font-size:84px;pointer-events:none;text-shadow:0 0 30px rgba(0,0,0,.9),0 0 60px rgba(0,0,0,.6);opacity:0;transition:opacity .35s}
.banner.show{opacity:1}
.plate{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;will-change:transform;--bw:54px}
.plate .nm{order:0;margin-bottom:1px;font-size:12px;font-weight:600;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 6px #000;opacity:0;transition:opacity .15s}
.plate.hi .nm{opacity:1}
.plate.tgt::after{content:'Targeted';font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#ff7466;background:rgba(36,6,6,.8);border:1px solid rgba(255,96,80,.7);border-radius:3px;padding:0 4px;line-height:13px;margin-top:1px}
.tgtTag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ff7466;border:1px solid rgba(255,96,80,.6);border-radius:3px;padding:0 4px;margin-left:6px;line-height:15px}
.plate.elite .nm::after{content:' \00b7  elite';color:var(--gilt);font-weight:500}
.plate .hb{order:2;width:var(--bw);height:4px;background:rgba(8,12,20,.85);border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 2px var(--iff)}
.plate.friend{--iff:rgba(110,245,140,.5)} .plate.foe{--iff:rgba(255,92,80,.6)} .plate.flag .hb{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 2px var(--gilt)}
.plate .hb i{display:block;height:100%}
.plate .sp{order:1;display:flex;gap:2px} .plate .sp b{width:calc((var(--bw) - 6px)/4);height:3px;border-radius:1px;background:rgba(45,58,86,.9)}
.plate.done{opacity:.55}
/* enemies carry a shape, not just a colour: a red diamond beside the hull bar */
.plate.foe::before{content:'';position:absolute;right:100%;bottom:-2px;margin-right:4px;width:7px;height:7px;transform:rotate(45deg);background:#ff6b5e;box-shadow:0 0 0 1.5px rgba(0,0,0,.8)} /* v53: the diamond sits beside the bars, so a foe's plate is no taller than a friend's */
.ftxt{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:19px;white-space:nowrap;text-shadow:0 0 3px #000,0 2px 8px #000;animation:rise 1.2s ease-out forwards;pointer-events:none}
@keyframes rise{0%{opacity:0;margin-top:8px}12%{opacity:1}75%{opacity:1}100%{opacity:0;margin-top:-48px}}
.intro{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,6,12,.94) 0%,rgba(4,6,12,.82) 38%,rgba(4,6,12,0) 68%);display:flex;align-items:center;z-index:20}
.intro .ibox{max-width:600px;max-height:100vh;overflow:auto;padding:20px 0;margin-left:max(40px,6vw)}
.intro h1{font-family:var(--gothic);font-weight:400;font-size:clamp(72px,9vw,132px);line-height:.9;text-shadow:0 0 40px rgba(208,166,75,.25)}
.intro .sub{font-size:21px;color:var(--gilt);margin:8px 0 14px}
.intro p{color:var(--bone2);max-width:60ch}
.scen{display:grid;gap:10px;margin:18px 0}
.scen button{text-align:left;padding:12px 14px;background:rgba(24,33,51,.8)}
.scen button b{font-size:17px;display:block;color:var(--bone)} .scen button small{color:var(--bone2);font-size:14px}
.scen button.sel{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.pickh{font-size:13px;color:var(--gilt);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
.facs{display:flex;flex-wrap:wrap;gap:6px}
.facs button{padding:6px 11px;background:rgba(24,33,51,.8);text-align:left}
.facs button small{display:block;color:var(--bone2);font-size:12px}
.facs button.sel{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt);color:var(--gilt)}
.fb{font-size:13.5px;margin:6px 0 0;min-height:1.4em}
.ctrls{font-size:13.5px;color:var(--bone2);line-height:2;margin-top:18px}
.endcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;padding:28px 34px;text-align:center;min-width:420px}
.endcard h2{font-family:var(--gothic);font-weight:400;font-size:64px;line-height:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#04060c;z-index:40;font-size:18px;color:var(--bone2)}
@media (max-width:900px){
  #btop{height:auto;min-height:48px;flex-wrap:wrap;gap:6px;padding:6px 8px} #btop .t,#scenName,#roundlbl{display:none} #btop button{padding:6px 9px;font-size:13px}
  #b_fleet{display:inline-block} #roster{display:none;top:64px;bottom:auto;max-height:45vh;width:220px;z-index:8} body.showroster #roster{display:block}
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:42vh;border-radius:10px 10px 0 0} #log,#camhint{display:none} body.showlog #log{display:block;position:absolute;left:8px;right:8px;width:auto;top:auto;bottom:calc(42vh + 8px);height:26vh;z-index:9;font-size:14px} body.sheetmin.showlog #log{bottom:110px}
  .setpanel{right:0;width:min(290px,92vw)}
  #app .mapwrap{grid-template-columns:1fr;height:auto} #app .mapmain{overflow:visible;padding:12px 14px} #app .mapmain h2{font-size:34px} #app .mapmain svg{width:100%;max-width:520px;margin:6px auto 0}
  #app .side{border-left:none;border-top:1px solid rgba(208,166,75,.25)} #app .legend,#app .mapmain .row.wrap{flex-wrap:wrap}
  .sheetbtn{display:block!important} body.sheetmin #panel{max-height:52px;overflow:hidden}
}
.sheetbtn{display:none;width:100%;margin:-6px 0 8px;padding:2px;background:transparent;border:none;color:var(--bone2);font-size:18px}
.tipcard{left:12px;bottom:150px;width:360px;padding:12px 14px;z-index:6} .tipcard h4{color:var(--gilt);font-size:15px;margin:0 0 4px} .tipcard p{margin:0 0 8px;font-size:13.5px;color:var(--bone2)}
@media (max-width:900px){ .tipcard{left:8px;right:8px;width:auto;bottom:auto;top:62px} }
@media (min-width:2200px){ body{font-size:16.5px} #roster{width:280px} #panel{width:400px} #log{width:520px;height:150px;font-size:15px} .weap,.stats{font-size:15px} .plate .nm{font-size:13.5px} }

#app{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(ellipse at 70% 40%,rgba(10,16,32,.55),rgba(4,6,12,.9) 70%);backdrop-filter:blur(2px)}
#app.hidden{display:none}
#app.see3d{background:radial-gradient(ellipse at 45% 55%,rgba(4,6,12,.05),rgba(4,6,12,.55) 60%,rgba(4,6,12,.85) 100%);backdrop-filter:none}
.notice{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;padding:18px 24px;max-width:460px;text-align:center}
#b_fleet{display:none}
.app-on .hud,.app-on #plates,.app-on .banner{display:none!important}
#app{

body{margin:0;height:100%;background:var(--ink);color:var(--bone);font-family:var(--ui);font-size:16px;line-height:1.4;overflow:hidden;
  background-image:radial-gradient(ellipse at 70% 0%,rgba(95,179,166,.07),transparent 55%),radial-gradient(ellipse at 10% 100%,rgba(208,73,63,.06),transparent 50%);}
.screen{height:100%;overflow:auto}
.gothic{font-family:var(--gothic);font-weight:400;letter-spacing:.01em}
.muted{color:var(--bone2)} .dim{color:var(--bone3)}
.gilt{color:var(--gilt)} .verd{color:var(--verd)} .blood{color:var(--blood)} .ember{color:var(--ember)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.num{font-variant-numeric:tabular-nums}

/* ---------- title ---------- */
.title{display:grid;place-items:center;text-align:center;position:relative}
.title canvas{position:absolute;inset:0;width:100%;height:100%}
.title .inner{position:relative;max-width:640px;padding:24px}
.title h1{font-family:var(--gothic);font-weight:400;font-size:clamp(64px,11vw,148px);line-height:.9;color:var(--bone);text-shadow:0 0 40px rgba(208,166,75,.25)}
.title .sub{font-size:20px;color:var(--bone2);margin:14px 0 34px}
.title .menu{display:flex;flex-direction:column;gap:10px;width:260px;margin:0 auto}
.title .menu button{font-size:18px;padding:11px}
.title .renown{margin-top:22px;color:var(--gilt)}

/* ---------- generic page ---------- */
.page{max-width:1440px;margin:0 auto;padding:28px 28px 60px}
.page h2.gothic{font-size:52px;line-height:1;margin-bottom:6px}
.page .lede{color:var(--bone2);margin:0 0 24px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{background:var(--iron);border:1px solid var(--iron3);padding:16px;border-radius:4px;position:relative}
.card.sel{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.card.locked{opacity:.55}
.card h3{font-size:20px;margin-bottom:4px}
.card p{margin:6px 0;color:var(--bone2);font-size:15px}
.card .foot{margin-top:12px}
.pill{display:inline-block;white-space:nowrap;font-size:13px;padding:1px 7px;border:1px solid var(--iron3);border-radius:10px;color:var(--bone2);margin:2px 4px 2px 0}
.pill.g{border-color:var(--gilt2);color:var(--gilt)}
.pill.v{border-color:#2f6a62;color:var(--verd)}
.pill.r{border-color:#6b2b27;color:#e07a70}

/* ---------- map ---------- */
.mapwrap{display:grid;grid-template-columns:1fr 330px;height:100%}
.mapmain{position:relative;overflow:auto;padding:22px 26px}
.mapmain h2{font-family:var(--gothic);font-weight:400;font-size:44px;line-height:1}
.mapmain svg{display:block;margin-top:10px;max-width:100%;height:auto}
.node{cursor:default}
.node.avail{cursor:pointer}
.node.avail:hover .ring{stroke:var(--gilt);stroke-width:3}
.side{background:var(--iron);border-left:1px solid var(--iron3);padding:18px;overflow:auto}
.side h3{font-size:18px;margin:14px 0 8px;color:var(--gilt)}
.shiprow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--iron2);font-size:15px}
.bar{height:6px;background:#3a1d1d;border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar>i{display:block;height:100%;background:var(--verd)}
.bar.low>i{background:var(--blood)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--bone2);font-size:14px;margin-top:8px}

/* ---------- battle ---------- */

/* ---------- modal ---------- */
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.choice small{display:block;color:var(--bone2);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

}

.title{background:transparent} .title canvas{display:none}
.side{background:rgba(12,18,31,.72)!important;backdrop-filter:blur(8px);border-left:1px solid rgba(208,166,75,.2)}
.card,.box{backdrop-filter:blur(6px)}
.screen{height:100%;overflow:auto}
.side{background:rgba(24,33,51,.82)}
.card{background:rgba(24,33,51,.86)}
}

/* the selected faction and a charged Command must be unmistakable */
body #app .facpick.on{background:var(--gilt)!important;color:#1a1206!important;border-color:var(--gilt)!important;font-weight:700}
.actstrip button.cmd:not([disabled]){background:linear-gradient(180deg,#f3d27a,#c99a3c)!important;color:#1a1206!important;border-color:#f3d27a!important;font-weight:700;box-shadow:0 0 12px rgba(240,200,110,.55)}
#panel .sect button[data-act=command]:not([disabled]){border-color:var(--gilt);box-shadow:0 0 10px rgba(240,200,110,.35)}

.encprev{display:grid;gap:8px;margin:10px 0 0;max-width:75ch;font-size:14px} .encprev>div{padding:8px 10px;border:1px solid rgba(208,166,75,.22);border-radius:8px;background:rgba(14,20,32,.55)} .encprev .muted{font-size:13.5px;margin-top:2px}
#terrlegend{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:8;padding:5px 10px;font-size:12.5px;cursor:pointer;max-width:min(440px,92vw)}
#terrlegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 3px;vertical-align:-1px}
#terrlegend .lg{display:flex;gap:6px;align-items:flex-start;margin-top:5px;line-height:1.35} #terrlegend .lg i{flex:0 0 11px;margin-top:3px}
@media (max-width:900px){ #terrlegend{top:84px} }
/* touch screens: 44px tap targets, no keyboard or mouse hints */
@media (hover:none) and (pointer:coarse){
  kbd,.keys,#camhint,.ctrls,.keysonly{display:none!important}
  button{min-height:44px}
  #btop button{min-height:44px!important;padding:6px 12px!important}
  .actstrip button{min-height:44px!important;min-width:44px!important}
  .facs button{min-height:44px;padding:8px 12px}
  .tipcard button{min-height:44px;padding:8px 14px}
  .sheetbtn{min-height:44px!important}
  #terrlegend{min-height:44px;padding:11px 12px;box-sizing:border-box}
  .weap{min-height:44px}
}
.recap .inner{max-height:100vh;overflow-y:auto;padding-bottom:40px}
.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:18px 0 10px}
.rtile{background:var(--glass);border:1px solid var(--iron3);border-radius:8px;padding:10px 8px;text-align:center}
.rtile b{display:block;font-size:26px;color:var(--gilt);line-height:1.1} .rtile span{font-size:12px;color:var(--bone2)}
.standout{margin:12px 0 4px}
.rhead{margin:16px 0 6px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone2)}
.rfleet{display:flex;flex-direction:column;gap:6px;text-align:left}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--iron3);border-radius:8px;padding:8px 12px}
.rrow .num{text-align:right;white-space:nowrap} .rrow.star{border-color:var(--gilt);box-shadow:0 0 0 1px var(--gilt2) inset}
.nextfac{margin-top:16px;padding:12px 14px;border:1px solid var(--verd);border-radius:8px;background:rgba(95,179,166,.08);text-align:left}
.boonhead{display:flex;gap:12px;align-items:center;border-bottom:2px solid;padding-bottom:10px}
.boonhead .sigil{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#0f1626;box-shadow:0 0 18px currentColor}
.choice.boon{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;align-self:stretch;box-sizing:border-box;padding:12px 14px 12px 12px;background:linear-gradient(90deg,rgba(255,255,255,.04),transparent)}
.choice.boon .rar{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.choice.boon b{font-size:17px}

/* v35 phone HUD: one-line top bar, gear icon, the ship sheet tucks away during enemy moves */
#b_set .si{display:none}
@media (max-width:900px){
  #btop{flex-wrap:nowrap!important;gap:5px!important;padding:4px 6px!important;min-height:44px!important;font-size:13px}
  #btop .objpre{display:none} #objlbl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  #turnlbl,#resolvelbl{white-space:nowrap;font-size:12.5px} #btop .spacer{display:none}
  #b_set .sl{display:none} #b_set .si{display:inline;font-size:17px;line-height:1}
  #btop button{flex:0 0 auto}
  body.enemyturn.sheetmin #panel{max-height:46px!important;transition:max-height .25s}
}

/* v38 progression */
.choice.sel{border-color:var(--gilt)!important;box-shadow:inset 0 0 0 1px var(--gilt);background:rgba(208,166,75,.12)!important}
.choice.sel b{color:var(--gilt)}
.progtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px} .progtabs button.on{background:var(--gilt);color:#1c1405;border-color:var(--gilt);font-weight:700}
.favrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(45,58,86,.8)}
.favrow .sg{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0f1626}

function genSector(s){

  const cols=[]; const COLS=7;
  for(let c=0;c<COLS;c++){
    let n = c===0||c===COLS-1 ? 1 : ri(2,4);
    const col=[];
    for(let i=0;i<n;i++){
      let type;
      if(c===0) type=s>=2?'shipyard':'battle'; /* after a sector boss the fleet docks before its next fight */
      else if(c===COLS-1) type='boss';
      else if(c===COLS-2) type=pick(['shipyard','drydock','field']); // always a rest stop before the boss
      else { const x=rnd(); type = x<.48?'battle':x<.61?'elite':x<.78?'event':x<.9?'shipyard':'drydock'; if(c===1&&(type==='elite'||type==='drydock')) type='battle'; }
      col.push({id:c+'-'+i, col:c, row:i, n, y:(i+.5)/n, type, done:false});
    }
    cols.push(col);

  // the column before the rest stop always offers an elite: a step up before the flagship, for those who want it
  { const c4=cols[COLS-3]; if(!c4.some(n=>n.type==='elite')){ const b=c4.find(n=>n.type==='battle')||c4.find(n=>n.type==='event'); if(b) b.type='elite'; } }
  // guarantee a shipyard in the middle and a rest stop before the boss

  if(!cols[COLS-2].some(n=>n.type==='drydock'||n.type==='shipyard')) cols[COLS-2][0].type='drydock';
  // node budgets: every column before the boss holds a fight, rest stops stay scarce and drydocks only sit before the boss
  for(let c2=1;c2<COLS-2;c2++){ const col=cols[c2];
    if(c2<COLS-2) for(const n of col) if(n.type==='drydock') n.type=rnd()<.5?'battle':'event';
    let rests=col.filter(n=>n.type==='shipyard'||n.type==='drydock'); while(rests.length>1){ rests.pop().type='battle'; rests=col.filter(n=>n.type==='shipyard'||n.type==='drydock'); }
    if(!col.some(n=>n.type==='battle'||n.type==='elite')){ const cand=col.filter(n=>n.type!=='shipyard'&&n.type!=='drydock'); (cand.length?pick(cand):col[col.length-1]).type='battle'; } }
  { const c3=ri(2,COLS-3), col=cols[c3], fights=col.filter(n=>n.type==='battle'||n.type==='elite'); const cand=col.filter(n=>n.type==='event'||(n.type==='battle'&&fights.length>1)); if(cand.length) pick(cand).type='field'; }
  for(const col of cols) for(const n of col) if(n.type==='battle'||n.type==='elite') Object.assign(n,rollEncounter(n.type,n.col)); // shown on the map
  if(typeof RUN!=='undefined'&&RUN) for(const col of cols) for(const n of col) if(n.type==='battle'||n.type==='elite'||n.type==='boss') n.rw=rollNodeReward(n.type);
  // every column after the first offers at least one fight that isn't a plain Engagement, and no two neighbours share a fight type
  for(let c2=1;c2<COLS-1;c2++){ const f=cols[c2].filter(n=>n.type==='battle'||n.type==='elite'); if(f.length&&!f.some(n=>ENC_SPECIAL.includes(n.enc))){ const n=pick(f), e=pick(ENC_SPECIAL); n.enc=e; n.shape=pick(ENCOUNTERS[e].shapes); }
    for(let i=1;i<f.length;i++) if(f[i].enc===f[i-1].enc){ const e=pick(ENC_POOL.filter(x=>x!==f[i].enc)); f[i].enc=e; f[i].shape=pick(ENCOUNTERS[e].shapes); } }
  const edges=[];

    const A=cols[c], B=cols[c+1];
    for(const a of A){ const near=[...B].sort((x,y)=>Math.abs(x.y-a.y)-Math.abs(y.y-a.y));
      edges.push([a.id,near[0].id]); if(near[1] && rnd()<.45 && Math.abs(near[1].y-a.y)<.5) edges.push([a.id,near[1].id]); }
    for(const b of B){ if(!edges.some(e=>e[1]===b.id)){ const near=[...A].sort((x,y)=>Math.abs(x.y-b.y)-Math.abs(y.y-b.y))[0]; edges.push([near.id,b.id]); } }

  let region=null; try{ region=pickRegion(fac); for(const col of cols) for(const n of col){ n.map=regionMap(region,n.col,COLS); fitEncounter(n); } }catch(e){ region=null; }

// ---------- Ashfall Corsairs: asymmetric scrap-built raiders ----------
const JUNK={Frigate:{w:.14,t:.09,b:.07,eng:1},Destroyer:{w:.12,t:.085,b:.07,eng:2,torp:1},Cruiser:{w:.13,t:.085,b:.075,eng:2,torp:1,scat:1},Carrier:{w:.17,t:.1,b:.09,eng:3,bays:1,chunks:2},'Battle-barge':{w:.16,t:.09,b:.085,eng:4,torp:1,scat:1,bays:1,chunks:3}};

  for(let i=0;i<Math.round(6+L*.5);i++){ const x=(r()-.55)*.8*L, side=r()<.6?1:-1; const pl=b.box(r()<.35?M.dark:M.hull,x,(r()-.3)*T,side*(W*(.8+r()*.4)),.06*L+r()*.1*L,.03*L+r()*.05*L,.02*L+r()*.03*L); pl.rotation.set((r()-.5)*.4,(r()-.5)*.3,(r()-.5)*.5); }
  for(let i=0;i<(p.chunks||0);i++){ const cx=(r()-.5)*.5*L, cz=(i%2?1:-1)*W*(1.1+r()*.3); const sub=[-.12,-.05,.05,.12].map(x=>({x:cx+x*L,w:W*(.35+r()*.2),t:T*(.5+r()*.3),b:Bt*.5,y:(r()-.5)*T})); const h=b.push(loftVD(sub,PROF.gothic,false,{cut:.12,iters:2,sub:2}),M.hull,null,cx>=b.split?'fore':'aft'); h.position.z=cz; h.rotation.y=(r()-.5)*.35; b.slab(M.dark,cx,-T*.25,cz*.55,.06*L,T*.5,Math.abs(cz)*.6,Math.abs(cz)*.45,{rake:.2,ry:Math.PI/2*0}); }
  // toothed ram-scoop

  for(let i=0;i<5;i++){ const z=(i-2)*W*.3; b.cylX(M.dark,.58*L,-Bt*.3+(i%2)*T*.3,z,.06*L,W*.18,0,4); }

  else { b.hard.P.push(new V3(0,T*.3,W*1.1)); b.hard.S.push(new V3(0,T*.3,-W*1.1)); }
  if(p.torp){ for(const z of [-.4,.4]){ b.cylX(M.dark,.44*L,T*.35,z*W,.08*L,W*.25,W*.25,8); b.hard.F.push(new V3(.49*L,T*.35,z*W)); } }
  b.hard.F.push(new V3(.52*L,0,0)); b.hard.T.push(new V3(bx,T+.16*L,0));

// ---------- The Chorus: living bio-ships ----------
const BIO={Frigate:{w:.16,t:.13,b:.12,tent:3},Destroyer:{w:.14,t:.11,b:.11,tent:4,maw:1},Cruiser:{w:.15,t:.12,b:.11,tent:4,spikes:1},Carrier:{w:.21,t:.17,b:.16,tent:6,sacs:1},'Bio-titan':{w:.18,t:.14,b:.14,tent:8,spikes:1,maw:1,sacs:1}};
function buildBio(b,cls){
  const p=BIO[cls]||BIO.Cruiser, L=b.L, M=b.M, W=p.w*L, T=p.t*L, Bt=p.b*L, r=seeded(cls.length*53+7);
  b.split=-.02*L;

  // glowing sacs on the flanks

  else b.sph(M.dark,.47*L,0,0,W*1.1,1.1,.8,.9);

  for(let i=0;i<p.tent;i++){ const a=(i/p.tent)*Math.PI*2, oy=Math.sin(a)*T*.5, oz=Math.cos(a)*W*.6; const pts=[]; for(let k=0;k<=12;k++){ const u=k/12; pts.push(new V3(-.42*L-u*L*(.45+r()*.2),oy*(1+u*.6)+Math.sin(u*5+i)*.03*L,oz*(1+u*.5)+Math.cos(u*4+i)*.04*L)); }
    tube(b,M.dark,pts,(k,d)=>Math.max(.004*L,.03*L*(1-k/12)),8); }

  if(p.sacs) b.bays.push(new V3(0,-Bt,W*.9),new V3(0,-Bt,-W*.9));

  return b.finish();
}

// ---------- The Ithar: elder sail-ships ----------
const SAIL={Frigate:{w:.07,t:.05,b:.045,sails:1},Destroyer:{w:.065,t:.05,b:.045,sails:2},Cruiser:{w:.08,t:.055,b:.05,sails:3,crest:1},Carrier:{w:.1,t:.06,b:.05,sails:2,wings:1},Ark:{w:.1,t:.07,b:.06,sails:4,ring:1,crest:1}};
function sailMesh(x0,x1,y0,h,sweep,z=0,tilt=0){
  const pos=[],idx=[],n=10; for(let i=0;i<=n;i++){ const k=i/n, x=x0+(x1-x0)*k, top=Math.sin(k*Math.PI*.95)*h; pos.push(x,y0,z, x-sweep*(1-k)*.6-sweep*.4,y0+top,z+Math.sin(tilt)*top); }
  for(let i=0;i<n;i++){ const a=i*2; idx.push(a,a+1,a+2,a+1,a+3,a+2); }
  const m=new BABYLON.Mesh('sail',G.scene); const vd=new BABYLON.VertexData(); vd.positions=pos; vd.indices=idx; const nr=[]; BABYLON.VertexData.ComputeNormals(pos,idx,nr); vd.normals=nr; vd.applyToMesh(m); return m; }
function buildSail(b,cls){
  const p=SAIL[cls]||SAIL.Cruiser, L=b.L, M=b.M, W=p.w*L, T=p.t*L, Bt=p.b*L;
  b.split=-.05*L;
  const sts=[[-.5,.5,.6,.6],[-.4,.9,.9,.9],[-.1,1,1,1],[.2,.8,.8,.8],[.4,.4,.5,.5],[.56,.02,.05,.05]].map(([x,w,t,bb])=>({x:x*L,w:w*W,t:t*T,b:bb*Bt}));
  b.loft(M.hull,sts,PROF.round,false);
  b.cylX(M.trim,.1*L,-Bt*.9,0,.7*L,.01*L,.004*L,6);
  const H=.35*L*(p.sails>2?1:.85);
  for(let i=0;i<p.sails;i++){ const off=(i-(p.sails-1)/2); const sm=sailMesh(-.3*L+off*.05*L,.25*L-Math.abs(off)*.08*L,T*.6,H*(1-Math.abs(off)*.18),.3*L,0,off*.35); b.add(sm,M.sail,'fore'); }
  b.cylY(M.trim,-.02*L,T*.5,0,H*.9,.002*L,.012*L,6);
  if(p.wings){ for(const side of [1,-1]){ const sm=sailMesh(-.3*L,.15*L,0,.3*L,.2*L,0,side*1.25); b.add(sm,M.sail,'aft'); } b.bays.push(new V3(-.1*L,0,W*1.4),new V3(-.1*L,0,-W*1.4)); }
  if(p.crest){ for(let i=0;i<3;i++) b.cylY(M.win,(-.25+i*.08)*L,T*.6,(i-1)*W*.5,.08*L*(1+(i===1)),0,.015*L,6); }
  if(p.ring){ b.torusX(M.trim,-.15*L,0,0,.45*L,.012*L); b.torusX(M.win,-.15*L,0,0,.42*L,.004*L); }
  b.engine(-.5*L,0,0,Math.min(W,T)*1.2);
  b.hard.F.push(new V3(.56*L,0,0)); b.hard.P.push(new V3(0,T*.3,W*1.1)); b.hard.S.push(new V3(0,T*.3,-W*1.1)); b.hard.T.push(new V3(0,T+H*.4,0));
  sailDetail(b,p,cls,W,T,Bt);
  return b.finish();
}

// ---------- The Deathless Dynasty: crescent tomb-ships ----------
const TOMB={Frigate:{R:.42,th:.1,arc:150},Destroyer:{R:.42,th:.1,arc:165,mono:1},Cruiser:{R:.42,th:.11,arc:185,mono:1,pyr:1},'Tomb-ark':{R:.42,th:.11,arc:215,mono:2,pyr:3,ring:1}};
function buildTomb(b,cls){
  const p=TOMB[cls]||TOMB.Cruiser, L=b.L, M=b.M, R=p.R*L, cx=-.02*L;
  b.split=cx;
  const arcPts=(rr,y=0,n=28)=>{ const pts=[]; for(let i=0;i<=n;i++){ const a=(-p.arc/2+p.arc*i/n)*Math.PI/180; pts.push(new V3(cx+Math.cos(a)*rr-R*.45,y,Math.sin(a)*rr)); } return pts; };
  const half=(side)=>arcPts(R).filter(v=>side*v.z>=-.001);
  for(const side of [1,-1]){ const pts=half(side); if(side<0) pts.reverse();
    tube(b,M.hull,pts,(k,d)=>{ const u=k/(pts.length-1); return p.th*L*(side>0?(1-u)*.8+.2:(u*.8+.2)); },6,true,.4); }
  for(const side of [1,-1]){ const pts=half(side).map(v=>new V3(v.x,.035*L,v.z)); tube(b,M.win,pts,()=>.006*L,4); }
  b.slab(M.dark,-.05*L,-.025*L,0,.5*L,.05*L,.08*L,.05*L,{rake:.2});
  for(let i=0;i<(p.mono||0);i++){ const x=(-.12-i*.18)*L; b.slab(M.dark,x,-.02*L,0,.075*L,.2*L,.075*L,.045*L,{rake:.08,cut:.06}); b.box(M.win,x+.036*L,.1*L,0,.002*L,.14*L,.012*L); }
  for(let i=0;i<(p.pyr||0);i++){ const x=(.05-i*.14)*L, z=(i%2?1:-1)*(i?.08*L:0); b.cylY(M.dark,x,.02*L,z,.12*L,0,.14*L,4,Math.PI/4); b.flashers.push(b.sph(M.win,x,.15*L,z,.016*L)); }
  if(p.ring){ b.torusX(M.dark,-.3*L,0,0,.3*L,.02*L); b.torusX(M.win,-.3*L,0,0,.3*L,.006*L); }
  const tipA=p.arc/2*Math.PI/180; const tip=s=>new V3(cx+Math.cos(tipA)*R-R*.45,.02*L,s*Math.sin(tipA)*R);
  b.hard.P.push(tip(1),new V3(cx+R*.2,.02*L,R*.8)); b.hard.S.push(tip(-1),new V3(cx+R*.2,.02*L,-R*.8)); b.hard.F.push(new V3(cx+R*.55,.03*L,0)); b.hard.T.push(new V3(-.1*L,.2*L,0));
  b.engine(-.3*L,0,0,.05*L);
  tombDetail(b,p,cls,R,cx);
  return b.finish();
}

// ---------- squadrons ----------
function buildCraft(fac,kind){
  const b=new SB(fac,CLS_LEN.Squadron), M=b.M, L=b.L;
  const st=(FACTIONS[fac]||{}).style;
  if(st==='junk'){ b.box(M.hull,0,0,0,L*.9,.25*L,.3*L); b.cylX(M.dark,-.3*L,0,0,.5*L,.3*L,.25*L,8); b.box(M.trim,0,0,0,.3*L,.04*L,.9*L); if(kind==='bomber') b.box(M.dark,.1*L,-.15*L,0,.5*L,.12*L,.2*L); }
  else if(st==='bio'){ b.sph(M.hull,0,0,0,.6*L,1.3,.9,.9); b.sph(M.win,.2*L,0,0,.25*L); for(let i=0;i<3;i++){ const a=i*2.1; b.cylX(M.dark,-.45*L,Math.sin(a)*.1*L,Math.cos(a)*.1*L,.5*L,.08*L,0,5); } }
  else if(st==='sail'){ b.cylX(M.hull,0,0,0,L,.16*L,0,6); const sm=sailMesh(-.35*L,.2*L,.05*L,.45*L,.25*L); b.add(sm,M.sail,'fore'); }
  else if(fac==='voidsworn'){ b.box(M.hull,0,0,0,L,.18*L,.2*L); b.box(M.trim,.1*L,0,0,.35*L,.04*L,.9*L,0,0,0); b.cylX(M.trim,.55*L,0,0,.25*L,.12*L,0,4);
    if(kind==='bomber'){ for(const z of [-.3,.3]) b.cylX(M.dark,.05*L,-.08*L,z*L,.6*L,.12*L,.1*L,8); }
    b.box(M.hull,-.35*L,.15*L,0,.2*L,.25*L,.04*L); }
  else { b.cylX(M.hull,0,0,0,L,.3*L,0,3,.4,1); for(const z of [-.28,.28]) b.box(M.dark,-.1*L,0,z*L,.5*L,.4*L,.03*L); b.box(M.trim,-.05*L,.05*L,0,.3*L,.03*L,.2*L);
    if(kind==='bomber') b.cylX(M.dark,0,-.12*L,0,.7*L,.18*L,.14*L,8); }
  b.cylX(M.eng,-.52*L,0,0,.06*L,.14*L,.14*L,8);
  return b.finish();
}
// squadron craft: built once per faction and kind, merged into one multi-material mesh, then drawn as instances
// (a wing is three craft; with wings in flight from the start, separate meshes cost ~50 draw calls per carrier)
const CRAFT_CACHE={};
function craftInstance(fac,kind){ const key=fac+'|'+kind; let p=CRAFT_CACHE[key];
  if(!p||p.isDisposed()){ const c=buildCraft(fac,kind); const all=c.root.getChildMeshes(false); const solid=all.filter(m=>m.getTotalVertices()>0&&!m.billboardMode);
    all.filter(m=>!solid.includes(m)).forEach(m=>m.dispose(false,false));
    p=BABYLON.Mesh.MergeMeshes(solid,true,true,undefined,false,true); c.root.dispose(false,false); if(!p) return null;
    p.name='craft_'+key; p.refreshBoundingInfo(true); p.isVisible=false; p.isPickable=false; p.position.y=-9000; CRAFT_CACHE[key]=p; }
  const inst=p.createInstance('craft'); inst.isPickable=true; inst.position.set(0,0,0); return {root:inst,meshes:[inst]}; }
// each ship class is built once, then cloned (clones share geometry)
const MODEL_CACHE={};
function buildShipModel(u){ if(u.isSq) return null; const fac=u.fac||'voidsworn', key=fac+'|'+u.cls;
  let p=MODEL_CACHE[key]; if(!p){ p=buildShipModelFresh(u); p.root.setEnabled(false); p.root.position.y=-9000; MODEL_CACHE[key]=p; }
  if(p.whole===undefined){ try{ p.whole=makeWholeProto(p.root); }catch(e){ console.warn('whole model failed',e); p.whole=null; } }
  const root=(p.whole||p.root).clone('ship',null); root.setEnabled(true); root.position.set(0,0,0);

// Live ships render from a merged copy (one mesh per material, about half the draw calls).

// ---------- asteroid surfaces: dust, darker basalt and mineral veins over the rock texture, in each rock's own coordinates ----------
class RockFxPlugin extends BABYLON.MaterialPluginBase{
  constructor(material){ super(material,'RockFx',200,{ROCKFX:false}); this._enable(true); }
  prepareDefines(defines){ defines.ROCKFX=true; }
  getClassName(){ return 'RockFxPlugin'; }
  getCustomCode(type){
    if(type==='vertex') return {CUSTOM_VERTEX_DEFINITIONS:'#ifdef ROCKFX\nvarying vec3 vRfxL;\n#endif\n',CUSTOM_VERTEX_MAIN_END:'#ifdef ROCKFX\nvRfxL=positionUpdated;\n#endif\n'};
    if(type!=='fragment') return null;
    return {CUSTOM_FRAGMENT_DEFINITIONS:`
#ifdef ROCKFX
varying vec3 vRfxL;
float rfxH(vec3 p){ p=fract(p*0.3183099+vec3(0.71,0.113,0.419)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }

#endif
`,CUSTOM_FRAGMENT_UPDATE_DIFFUSE:`
#ifdef ROCKFX
  { vec3 q=vRfxL*2.3; float a=rfxN(q)*0.6+rfxN(q*2.7)*0.28+rfxN(q*7.5)*0.12;

`}; }

  frag:`precision highp float; varying vec2 vUV; uniform vec3 col; uniform float t; uniform float seed;
    NOISE

      float open=sin(clamp(t,0.0,1.0)*3.14159); float R=0.25+0.6*open;

// a many-pointed star burst, for muzzle blasts and impacts

    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const u=x/(w-1), v=(y-h/2)/(h/2), wd=.12+.75*Math.pow(u,.8), a=Math.pow(1-u,1.3)*Math.exp(-(v*v)/(wd*wd)*2.2)*Math.min(1,u*14);

function vfxMat(name,col,tex,alpha){ const m=new BABYLON.StandardMaterial(name,G.scene); m.disableLighting=true; m.diffuseColor=C3.Black(); m.specularColor=C3.Black(); m.emissiveColor=col; m.opacityTexture=tex; m.alpha=alpha==null?1:alpha; m.alphaMode=BABYLON.Engine.ALPHA_ADD; m.disableDepthWrite=true; m.backFaceCulling=false; return m; }

  frag:`precision highp float; varying vec2 vUV; uniform vec3 col; uniform float t; uniform float seed; uniform float thick;

// engine plumes: white-hot core, faction-coloured sheath, shock diamonds near the nozzle, flicker
const PLUME_GLSL={vert:`precision highp float; attribute vec3 position; attribute vec3 normal; attribute vec2 uv; uniform mat4 world; uniform mat4 worldViewProjection; varying vec2 vUV; varying vec3 vN; varying vec3 vP;

  frag:`precision highp float; varying vec2 vUV; varying vec3 vN; varying vec3 vP; uniform vec3 col; uniform vec3 camPos; uniform float t; uniform float flip;
    void main(){ float v=mix(vUV.y,1.0-vUV.y,flip); vec3 V=normalize(camPos-vP); float f=abs(dot(normalize(vN),V)); float core=pow(f,2.6);

      vec3 c=mix(col,vec3(1.0,0.97,0.93),core*smoothstep(0.55,1.0,v)*0.85);
      float a=along*(0.2+0.8*core)*dia*fl;
      gl_FragColor=vec4(c*a*1.9,a); }`};

// ---------- v44 GPU sprite pool: hundreds of flashes, sparks and streaks in a single draw call ----------
// cells: 0 soft glow, 1 four-point star, 2 ring, 3 streak (along x)
function fxPoolURL(){ const S=128, N=4, c=document.createElement('canvas'); c.width=S*N; c.height=S; const g=c.getContext('2d'), img=g.createImageData(S*N,S), d=img.data;
  for(let cell=0;cell<N;cell++) for(let y=0;y<S;y++) for(let x=0;x<S;x++){ const dx=(x+.5-S/2)/(S/2), dy=(y+.5-S/2)/(S/2), r=Math.hypot(dx,dy); let v=0;
    if(cell===0) v=Math.exp(-r*r*4.5)*clamp((1-r)*5,0,1);
    else if(cell===1) v=(Math.exp(-r*r*16)*1.3+(Math.exp(-Math.abs(dy)*34)*Math.exp(-Math.abs(dx)*2.6)+Math.exp(-Math.abs(dx)*34)*Math.exp(-Math.abs(dy)*2.6))*.9+Math.exp(-r*r*3.2)*.22)*clamp((1-r)*3,0,1);
    else if(cell===2) v=(Math.exp(-Math.pow((r-.74)*10,2))*.95+Math.exp(-r*r*5)*.1)*clamp((1-r)*6,0,1);
    else v=Math.exp(-dy*dy*38)*Math.pow(Math.max(0,1-Math.abs(dx)),.7)*(dx>0?1:.75+.25*(1+dx));
    const o=(y*S*N+cell*S+x)*4; d[o]=d[o+1]=d[o+2]=255; d[o+3]=Math.round(clamp(v,0,1)*255); }
  g.putImageData(img,0,0); return c.toDataURL(); }
// a second pool for smoke: soft alpha-blended puffs (not additive), so explosions and wrecks smoke without a particle system each
function fxSmokeURL(){ const S=128, c=document.createElement('canvas'); c.width=S; c.height=S; const g=c.getContext('2d'), img=g.createImageData(S,S), d=img.data, r=seeded(77);
  const blobs=[]; for(let i=0;i<9;i++) blobs.push([(r()-.5)*.6,(r()-.5)*.6,.25+r()*.3]);
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){ const dx=(x+.5-S/2)/(S/2), dy=(y+.5-S/2)/(S/2); let v=0; for(const [bx,by,br] of blobs){ const q=Math.hypot(dx-bx,dy-by)/br; v+=Math.exp(-q*q*2.2); }
    v=clamp(v*.55,0,1)*clamp((1-Math.hypot(dx,dy))*2.5,0,1); const sh=.75+.25*(-dx-dy)*.5; const o=(y*S+x)*4; d[o]=d[o+1]=d[o+2]=Math.round(255*clamp(sh,0,1)); d[o+3]=Math.round(v*255); }
  g.putImageData(img,0,0); return c.toDataURL(); }
function mkPool(kind){ const smoke=kind==='smoke', cap=smoke?(G.mobile?220:600):(G.mobile?700:1800);
  const mgr=new BABYLON.SpriteManager(smoke?'fxSmoke':'fxPool',smoke?fxSmokeURL():fxPoolURL(),cap,{width:128,height:128},G.scene);
  mgr.blendMode=smoke?BABYLON.Constants.ALPHA_COMBINE:BABYLON.Constants.ALPHA_ADD; mgr.disableDepthWrite=true; mgr.isPickable=false; return {mgr,cap,live:[],free:[],smoke}; }
function fxPool(){ const P=G.fxPool; if(P&&P.scene===G.scene) return P;
  try{ const add=mkPool('add'); let sm=null; try{ sm=mkPool('smoke'); }catch(e){}
    G.fxPool={scene:G.scene,mgr:add.mgr,cap:add.cap,live:add.live,free:add.free,pools:[add].concat(sm?[sm]:[]),add,sm,last:G.time||0,amb:0}; return G.fxPool; }catch(e){ console.warn('fxPool',e); G.fxPool={scene:G.scene,mgr:null,live:[],free:[],pools:[]}; return G.fxPool; } }
// spawn one pooled sprite. size is in world units; vel moves it (grav pulls it down); ang rotates in screen space; w/h stretch it; smoke:true uses the alpha-blended smoke pool
function fxp(pos,{cell=0,size=1,col=WHITE3,dur=.3,grow=.8,vel=null,drag=0,spin=0,alpha=1,ang=null,w=1,h=1,fade=2,grav=0,smoke=false}={}){ const P0=fxPool(); const P=smoke?P0.sm:P0.add; if(!P||!P.mgr) return null;
  let e; if(P.live.length>=P.cap-2){ e=P.live.shift(); } else if(P.free.length) e=P.free.pop(); else e={sp:new BABYLON.Sprite('fxp',P.mgr),vel:new V3(0,0,0),c:new C4(1,1,1,1)};
  e.gen=(e.gen||0)+1; const sp=e.sp; sp.isVisible=true; sp.cellIndex=smoke?0:cell; sp.position.copyFrom(pos); sp.angle=ang==null?Math.random()*6.283:ang; e.c.set(col.r,col.g,col.b,alpha); sp.color=e.c;
  e.t0=G.time; e.dur=Math.max(.02,dur)*Math.max(.3,SPEED); e.s0=size; e.grow=grow; e.mv=!!vel; if(vel) e.vel.copyFrom(vel); e.drag=drag; e.spin=spin; e.r=col.r; e.g=col.g; e.b=col.b; e.alpha=alpha; e.w=w; e.h=h; e.fade=fade; e.grav=grav; e.smoke=smoke;

function fxPoolTick(){ const P=G.fxPool; if(!P||!P.mgr||P.scene!==G.scene) return; const now=G.time, dt=Math.min(.1,Math.max(0,now-P.last)); P.last=now; const sc=dt/Math.max(.3,SPEED);

    fxp(q,{cell:3,size:40+Math.random()*40,col:col.scale(.7),dur:.4+Math.random()*.4,grow:0,vel:v.scale(220),ang:screenAng(q,v),w:1,h:.12,fade:1}); } }

// point defence: the target's guns hose tracer streams at an incoming torpedo and flak pops around it
function pdFire(vt,p){ try{ if(!vt||!vt.root||vt.root.isDisposed()||G.fxReduced) return; if(Math.random()>(G.mobile?.18:.5)) return; const gl=vt.model&&vt.model.guns; if(!gl) return;
  const pool=gl.T.length?gl.T:gl.P.concat(gl.S); if(!pool.length) return; vt.root.computeWorldMatrix(true); const g=V3.TransformCoordinates(pool[Math.floor(Math.random()*pool.length)],vt.root.getWorldMatrix());
  const aim=p.add(new V3((Math.random()-.5)*5,(Math.random()-.5)*3,(Math.random()-.5)*5)), v=aim.subtract(g), d=v.length(); v.normalize(); const col=(FAC3D[vt.fac]||FAC3D.hegemony).bolt;
  fxp(g,{cell:1,size:1.6,col:C3.Lerp(col,WHITE3,.5).scale(1.5),dur:.08});
  for(let i=0;i<3;i++){ const q=g.add(v.scale(i*2.2)); fxp(q,{cell:3,size:2.6,col:col.scale(1.5),dur:Math.min(.5,d/240),grow:0,vel:v.scale(240),ang:screenAng(q,v),w:1,h:.16,fade:.6}); }
  if(Math.random()<.55){ const f=p.add(new V3((Math.random()-.5)*6,(Math.random()-.5)*4,(Math.random()-.5)*6)); fxp(f,{cell:0,size:3.2,col:new C3(1,.7,.35).scale(1.4),dur:.22,grow:.9}); fxp(f,{cell:1,size:2.4,col:new C3(1,.95,.8).scale(1.4),dur:.09}); if(!G.mobile) fxp(f,{cell:0,size:3.5,col:new C3(.12,.11,.1),dur:1.2,grow:1.3,fade:1}); } }catch(e){} }

// v44.1 warm-up: on battle start, a tiny blast far off on the skyline (it reads as the distant war) compiles the explosion, fireball, shock-ring
// and beam shaders, and every faction's wreck materials are compiled against a real hull mesh, so the first kill doesn't stall
function warmFx(){ try{ if(!G.scene||!G.cam||!B) return; fxMark('warmup'); fxPool(); flashLights(); fireSheet(); starTex(); coneTex(); scorchMat();
    let far; try{ const eng=G.engine, ray=G.scene.createPickingRay(eng.getRenderWidth()*.62,eng.getRenderHeight()*.12,BABYLON.Matrix.Identity(),G.cam); far=ray.origin.add(ray.direction.scale(520)); }catch(e){ far=null; } // on screen (near the top) so the shaders really draw and compile
    if(!far){ const tg=G.cam.getTarget(), fwd=tg.subtract(G.cam.position); fwd.normalize(); far=G.cam.position.add(fwd.scale(520)); }
    explode(far,3,{light:false}); if(typeof fireballFx==='function') fireballFx(far,6,1);
    try{ const dn=new BABYLON.TransformNode('warmDome',G.scene); dn.position.copyFrom(far); shieldDome({root:dn,L:10,H:3,fac:'hegemony'},new V3(0,0,1),new C3(.5,.8,1)); setTimeout(()=>{ try{ dn.dispose(); }catch(e){} },2500); }catch(e){ console.warn('warm dome',e); } /* v45: shield dome shader too */
    shockRing(far,14,new C3(1,.7,.45),{flat:false,dur:.6}); beam(far,far.add(new V3(40,0,10)),new C3(.6,.8,1),.6,.3);
    try{ if(typeof beamMaterial==='function'){ const cy=MB.CreateCylinder('warmBeam',{height:1,diameter:1,tessellation:14},G.scene); cy.position.set(0,-9000,0); const bm=beamMaterial(new C3(.6,.8,1)); cy.material=bm; bm.forceCompilation(cy,()=>{ cy.dispose(); bm.dispose(); }); } }catch(e){} // a short beam can expire before its first frame on a slow device
    try{ for(const m of G.scene.meshes){ const mt=m.material; if(mt&&/^(fireM|shRipM|shockM|beamM)/.test(mt.name)&&!m.isDisposed()) mt.forceCompilation(m); } }catch(e){} // compile even if the warm-up blast lands off screen
    // decal and streak materials (scorch, ember glow, flame tongue) on a throwaway plane
    try{ const pl=MB.CreatePlane('warmPl',{size:1},G.scene); pl.position.set(0,-9000,0); pl.scaling.set(2,.5,1); pl.computeWorldMatrix(true); /* streaks are scaled unevenly, which selects a different shader variant */ const em=emMat('emberM',new C3(1.4,.55,.15),1); em.opacityTexture=G.tex.soft; em.alphaMode=BABYLON.Engine.ALPHA_ADD; em.disableDepthWrite=true;
      const vm=vfxMat('fxkM',new C3(1,.7,.4),coneTex(),1); let left=3; const done=()=>{ if(--left<=0){ pl.dispose(); em.dispose(); vm.dispose(); } };
      for(const m of [scorchMat(),em,vm]) m.forceCompilation(pl,done); }catch(e){}
    // wreck materials against both the merged live hull and the split copy a dying ship swaps to (their vertex layouts can differ)
    const facs=new Set(); for(const v of G.views.values()) if(v.model&&v.model.meshes){ facs.add(v.fac); const M=facMats(v.fac); for(const m of v.model.meshes.slice(0,2)) for(const mat of [M.wreck,M.ember]) try{ mat.forceCompilation(m); }catch(e){} }
    if(typeof debBatch==='function') for(const f of facs){ for(const kind of ['wreck','ember']){ try{ const db=debBatch(f,kind); db.buf.fill(0,0,16); db.mesh.thinInstanceCount=1; db.mesh.thinInstanceBufferUpdated('matrix'); db.dirty=true; db.mesh.material.forceCompilation(db.mesh); }catch(e){} } } // v45: the thin-instance debris variant
    if(typeof MODEL_CACHE!=='undefined') for(const [k,p] of Object.entries(MODEL_CACHE)){ const fac=k.split('|')[0]; if(!facs.has(fac)||!p||!p.root) continue; const M=facMats(fac); for(const m of p.root.getChildMeshes(false).filter(x=>x.name.includes('hull_')).slice(0,3)) for(const mat of [M.wreck,M.ember]) try{ mat.forceCompilation(m); }catch(e){} } }catch(e){ console.warn('warmFx',e); } }

// touch screens: say tap, not click or hover
function touchWords(h){ if(!(typeof G!=='undefined'&&G.mobile)||typeof h!=='string') return h;

function showTip(html,x,y){ tipEl.innerHTML=touchWords(html); tipEl.style.display='block';

    tipEl.style.left='8px'; tipEl.style.maxWidth=(innerWidth-16)+'px'; const r=tipEl.getBoundingClientRect(), pn=document.getElementById('panel'), pt=pn&&pn.offsetParent?pn.getBoundingClientRect().top:innerHeight;
    tipEl.style.top=Math.max(8,pt-r.height-8)+'px'; return; }
  tipEl.style.maxWidth=''; const r=tipEl.getBoundingClientRect();
  let lx=x+18, ly=y+14; if(lx+r.width>innerWidth-8) lx=x-r.width-14; if(ly+r.height>innerHeight-8) ly=innerHeight-r.height-8; tipEl.style.left=lx+'px'; tipEl.style.top=ly+'px'; }

let titleRaf=0;
function titleScreen(){
  RUN=null; B=null;
  show(`<div class="screen title"><canvas id="titlecv" aria-hidden="true"></canvas><div class="inner">
    <h1>Voidsworn</h1>
    <p class="sub">Command a crusade of gothic capital ships through three hostile sectors. Every hull you lose stays lost, and so does its captain.</p>
    <div class="menu">
      ${SAVED_RUN?`<button class="primary" data-act="continueRun">Continue run</button>`:''}
      <button class="${SAVED_RUN?'':'primary'}" data-act="newRunScreen">New run</button>
      <button data-act="legacy">Progression${(META.renown||0)>=15?' <span class="gilt num">\u25cf</span>':''}</button>
      <button data-act="help">How to play</button>
    </div>
    <div class="renown num">${META.stats.best?`Best: sector ${roman(Math.min(3,META.stats.best))}${META.stats.wins?` \u00b7 ${META.stats.wins} full victor${META.stats.wins>1?'ies':'y'}`:''}`:''}</div>
  </div></div>`);
  const cv=document.getElementById('titlecv'), g=cv.getContext('2d');
  const stars=[...Array(260)].map(()=>({x:rnd(),y:rnd(),z:rnd()*.8+.2}));
  const t0=performance.now();
  cancelAnimationFrame(titleRaf);
  const loop=now=>{ if(!document.body.contains(cv)) return;
    const dpr=Math.min(2,devicePixelRatio||1), w=cv.clientWidth, h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
    g.setTransform(dpr,0,0,dpr,0,0);
    const bg=g.createRadialGradient(w*.7,h*.2,0,w*.7,h*.2,Math.max(w,h)); bg.addColorStop(0,'#17233d'); bg.addColorStop(1,'#070b15'); g.fillStyle=bg; g.fillRect(0,0,w,h);
    const t=(now-t0)/1000;
    for(const s of stars){ const x=((s.x*w - t*6*s.z)%w+w)%w; g.fillStyle=`rgba(230,220,196,${s.z*.8})`; g.fillRect(x,s.y*h,s.z*1.6,s.z*1.6); }
    const L=Math.min(w*.5,h*.7), span=w+L*1.2;
    const drift=(speed,start,len)=>{ const s=w+len*.6; return s-((t*speed+(s-start))%(w+len*1.2)); };
    const x=drift(9,w*.74,L), y=h*.8;
    g.save(); g.translate(x,y); g.rotate(Math.PI); g.globalAlpha=.92; drawShipShape(g,'gothic',L,FACTIONS.voidsworn,'player',null,false); g.restore();
    const x2=drift(16,w*.2,L*.3); g.save(); g.translate(x2,h*.63); g.rotate(Math.PI); g.globalAlpha=.6; drawShipShape(g,'gothic',L*.3,FACTIONS.voidsworn,'player',null,false); g.restore();
    const x3=drift(12,w*.9,L*.22); g.save(); g.translate(x3,h*.18); g.rotate(Math.PI); g.globalAlpha=.45; drawShipShape(g,'gothic',L*.22,FACTIONS.voidsworn,'player',null,false); g.restore();
    const vg=g.createLinearGradient(0,0,0,h); vg.addColorStop(0,'rgba(15,22,38,0)'); vg.addColorStop(1,'rgba(15,22,38,.55)'); g.fillStyle=vg; g.fillRect(0,0,w,h);
    titleRaf=requestAnimationFrame(loop); };
  titleRaf=requestAnimationFrame(loop);
}

      Object.entries(PATRONS).map(([p,P])=>{ const f=favourOf(p), t=favourTier(p), nx=FAVOUR_TIERS[t+1]; return `<div class="favrow"><div class="sg" style="background:${P.col}">${P.glyph}</div><div><b>${esc(P.n)}</b><div class="dim" style="font-size:13px">${esc(P.theme)}</div></div><div class="num" style="text-align:right"><b style="color:${P.col}">${esc(FAVOUR_TIERS[t].n)}</b><div class="dim" style="font-size:12.5px">${f}${nx?` / ${nx.at}`:''}</div></div></div>`; }).join('')+'</div>'; }
  if(progTab==='heat'){ const wins=META.stats.wins||0; body=`<p class="lede">${wins?'Heat is open. Pick rules on the admiral screen before a run; each level adds 10% renown.':'Win a run to open Heat.'}</p><div class="cards">${Object.entries(HEAT).map(([k,h])=>`<div class="card"><h3>${esc(h.n)} <span class="dim">+${h.w}</span></h3><p>${esc(h.d)}</p></div>`).join('')}</div>

// ---------- help ----------
function helpScreen(){
  show(touchWords(`<div class="screen"><div class="page" style="max-width:820px">
    <h2 class="gothic">How to play</h2>
    <p class="lede">Voidsworn is a roguelite. Each run crosses three sectors, each ending in a flagship battle. Ships and captains you lose are gone for the run; every faction, admiral and ship is available from the start.</p>
    <p>What carries between runs (Progression, on the title screen): <b>renown</b> buys hull variants for your shipyards; each <b>admiral</b> levels up as you fly with them, unlocking an alternate fleet, a fourth aspect, a second Command and a veteran flag captain; <b>patrons</b> grow fond of you as you take their boons, offering rarer boons and eventually a gift at the start of a run; and after your first victory, <b>Heat</b> lets you add harder rules for more renown. After each sector flagship falls, the fleet docks at a shipyard before its next fight.</p>
    <h3 class="gilt" style="margin:18px 0 6px">Your turn</h3>
    <p>Every ship can move, turn and fire each of its weapons once per turn, in any order. Click a ship, then click a highlighted hex to move. Moving forward costs 1 movement. Turning 60\u00b0 also costs 1 movement and uses one of the ship\u2019s turns; big ships only get one turn per round, so plan their heading early. Press <kbd>Q</kbd> and <kbd>E</kbd> to turn in place.</p>
    <p>Thrusters keep you from getting boxed in. A ship can slip into either forward-diagonal hex, or back off one hex, without changing its heading (2 movement each; a slow ship can always spend its whole move on one hop). It can climb over a rock or wreck, or dive under an enemy ship, for +1 movement, but cannot stop there. Each faction bends one of these rules: see the Helm panel.</p>
    <p>Ships fight on the move. Tap an enemy your guns can't reach yet and the ship burns to the best spot and fires as it arrives.</p>
    <p>Moving matters. A ship that did not move last turn gets hit more easily (+10 to hit). One that moved 3+ hexes is harder to hit (\u22125). Port and starboard guns hit 10% harder on a raking pass, after moving 2+ hexes.</p>
    <h3 class="gilt" style="margin:18px 0 6px">Firing arcs</h3>
    <p>Weapons only fire into their arc. Prow weapons cover the 120\u00b0 in front, port and starboard broadsides each cover a wide 120\u00b0 cone to the side, and turrets fire anywhere. The tinted hexes around a selected ship show where its guns reach: amber for the prow, teal for broadsides. Click an enemy to fire everything that can reach it, or press a number key to fire a single weapon.</p>
    <h3 class="gilt" style="margin:18px 0 6px">Shields and flanking</h3>
    <p>Each ship has four shield facings: prow, port, starboard and rear. Damage hits the facing that points at the attacker, and shields regenerate at the start of each of your turns. Rear hits halve armor and are far more likely to crit, so getting behind a battleship matters. Lances and bombers punch partly or fully through shields. Ion cannons shred shields; gauss weapons mostly ignore them.</p>
    <h3 class="gilt" style="margin:18px 0 6px">Different fights</h3>
    <p>Each fight on the sector map is labelled with its goal. Engagements and ambushes end when one fleet breaks. In <b>Hold the station</b> you keep enemies off a friendly station until round 6 ends. In a <b>Hunt</b> their flagship runs and jumps out after round 6. In an <b>Intercept</b> you destroy transports before they cross the field. In a <b>Breakthrough</b> you get half your fleet off the far edge. Missing a Hunt or Intercept still pays half; losing the station or a breakthrough means a retreat, not the end of the run. Tap the chip under the top bar in battle for the rules and the coloured hexes.</p>
    <p>Some fights change partway through: reinforcements for either side, or a solar flare that knocks out every shield for a round. You always get a round of warning.</p>
    <h3 class="gilt" style="margin:18px 0 6px">Brace, abilities and Command</h3>
    <p>Brace is the alternative to firing: a ship that hasn\u2019t fired can brace to take 40% less hull damage until your next turn (it can still move first). To ram, point your bow at an enemy ship with at least one clear hex between you and enough movement left to cross the gap: a red lane shows when a ram is ready, and red-ringed move hexes line one up. A longer run-up hits harder; a ram can\u2019t take more than 40% of a healthy ship\u2019s hull without boons. Boarding an adjacent enemy can capture it for your fleet; enemy boarders can cripple your ships, but never take them. Carriers start every battle with their wings already flying; the wings fight on their own unless you order them: tap a wing, then tap an enemy ship to strike it or one of your ships to guard it. The carrier\u2019s launch only replaces wings you lose. Most hulls have an ability with a cooldown, and each faction has its own: Hegemony ion pulses, Corsair overburn, Chorus regrowth and frenzy, Ithar phase jumps, Deathless reanimation beams, and the Voidsworn\u2019s burns, reloads and shield surges. Enemy flagships carry a Command too: they announce it a round ahead, so you can brace or scatter. Once per battle, your admiral\u2019s Command is a fleet-wide signature move. It gets stronger each round you hold it (power 1 in round 1, 2 in round 2, full power from round 3, and losing a ship charges it a level), so the choice is a smaller boost now or a bigger one later, if the fight lasts that long. The ship panel shows exactly what the next level adds.</p>
    <h3 class="gilt" style="margin:18px 0 6px">Patrons, boons and your flagship</h3>
    <p>Each run, four of six patrons watch your run. Battles on the map carry a patron\u2019s sigil: win there and that patron offers three boons, and you take one. Boons change the rules (fires, chain explosions, rams that shake the whole formation) and come in Common, Rare and Epic strength. Hold boons from two patrons and a duo boon can appear. At the start of a run you also pick one of three aspects for your flagship, which shapes how it fights for the whole run. Each sector\u2019s enemies have a set strength, so a stronger fleet feels stronger; a battered fleet meets slightly smaller ones.</p>
    <h3 class="gilt" style="margin:18px 0 6px">Between battles</h3>
    <p>Hull damage carries between battles. Shipyards sell hulls, refits and repairs, and can upgrade a ship\u2019s Mark. Captains earn experience and pick a perk at each promotion. Relics are fleet-wide bonuses that last for the run.</p>
    <h3 class="gilt keysonly" style="margin:18px 0 6px">Keys</h3>
    <p class="keysonly"><kbd>Tab</kbd> next ship, <kbd>Q</kbd>/<kbd>E</kbd> turn, <kbd>1</kbd>\u2013<kbd>6</kbd> arm a weapon, <kbd>B</kbd> brace, <kbd>A</kbd> toggle arcs, <kbd>Esc</kbd> or right-click to cancel, <kbd>Enter</kbd> end turn.</p>
    <div class="row" style="margin-top:24px"><button class="primary" data-act="title">Back</button></div>
  </div></div>`));
}

const WIN_TITLE={voidsworn:'The crusade endures',hegemony:'The Hegemony stands',corsair:'The loot is yours',chorus:'The Chorus swells',ithar:'The Ithar endure',deathless:'The Dynasty rises'};
function runRecap(victory){ const s=RUN.stats, mins=RUN.t0?Math.max(1,Math.round((Date.now()-RUN.t0)/60000)):null;
  const tile=(n,l)=>`<div class="rtile"><b class="num">${n}</b><span>${l}</span></div>`;
  const tiles=`<div class="rtiles">${tile(s.battles,'battles won')}${tile(s.bosses,'flagships destroyed')}${tile(s.kills,'enemy ships destroyed')}${tile(s.lost||0,'ships lost')}${mins?tile(mins<90?mins+'m':(mins/60).toFixed(1)+'h','played'):''}</div>`;
  const fl=(RUN.fleet||[]).filter(x=>x.hp>0), score=x=>x.car?x.car.dealt+x.car.kills*40:0, best=fl.slice().sort((a,b)=>score(b)-score(a))[0];
  const row=x=>{ const c=x.car||{dealt:0,kills:0,battles:0}; return `<div class="rrow${x===best&&score(x)>0?' star':''}"><div><b>${esc(x.name)}</b> <span class="dim">${esc(HULLS[x.tpl].n)}</span><div class="dim" style="font-size:12px">${esc(rankName(x.cap))} ${esc(x.cap.name)}</div></div><div class="num">${c.kills} kills<br><span class="dim">${c.dealt} dmg</span></div></div>`; };
  const stand=best&&score(best)>0?`<p class="standout">Standout ship: <b class="gilt">${esc(best.name)}</b>, ${best.car.kills} kills and ${best.car.dealt} damage across ${best.car.battles} battle${best.car.battles>1?'s':''}.</p>`:'';
  const fleet=fl.length?`<h3 class="rhead">${victory?'The fleet that finished it':'Still flying'}</h3><div class="rfleet">${fl.sort((a,b)=>score(b)-score(a)).map(row).join('')}</div>`:'';
  return tiles+stand+fleet; }
function nextFacPick(){ const won=(META.stats.wonFacs||[]), pool=RUN_FACTIONS.filter(f=>f!==RUN.fac&&!won.includes(f)); return pick(pool.length?pool:RUN_FACTIONS.filter(f=>f!==RUN.fac)); }
function endRun(victory, abandoned){
  const s=RUN.stats;
  const prevBest=META.stats.best||0; META.stats.best=Math.max(prevBest, RUN.sector); if(victory){ META.stats.wins++; META.stats.wonFacs=META.stats.wonFacs||[]; if(!META.stats.wonFacs.includes(RUN.fac)) META.stats.wonFacs.push(RUN.fac); }
  for(const f of RUN.fallen) META.fallen.push(f); if(META.fallen.length>80) META.fallen=META.fallen.slice(-80);
  try{ tel('run_end',{victory:!!victory,abandoned:!!abandoned,fac:RUN.fac,sector:RUN.sector,stats:s,mins:RUN.t0?Math.round((Date.now()-RUN.t0)/60000):null,fleet:(RUN.fleet||[]).map(x=>x.tpl)}); }catch(e){}
  // what carries forward: renown (more with Heat), admiral mastery, and a Heat record for this faction
  const hl=heatLevel(RUN.heat), ren=Math.round((typeof runRenown==='function'?runRenown():0)*(1+.1*hl)); META.renown=(META.renown||0)+ren;
  const mx0=masteryLevel(RUN.admiral), mxGain=s.battles+s.elites*2+s.bosses*5+(victory?10:0); META.mastery=META.mastery||{}; META.mastery[RUN.admiral]=(META.mastery[RUN.admiral]||0)+mxGain; const mx1=masteryLevel(RUN.admiral);
  if(victory&&hl){ META.heatBest=META.heatBest||{}; META.heatBest[RUN.fac]=Math.max(META.heatBest[RUN.fac]||0,hl); }
  RUN.carry={ren,mxGain,mx0,mx1,hl};
  RUN.over=true; SAVED_RUN=null; Persist.save();
  const nf=victory?nextFacPick():null, NF=nf&&FACTIONS[nf];
  const cy=RUN.carry, nextLv=MASTERY_PERKS[Math.min(4,cy.mx1+1)];

    <p style="margin:4px 0"><b class="gilt num">+${cy.ren} renown</b>${cy.hl?` <span class="dim">(Heat ${cy.hl}: +${cy.hl*10}%)</span>`:''} \u00b7 you now have ${META.renown}. Spend it on hull variants in Progression.</p>
    <p style="margin:4px 0">${esc(ADMIRALS[RUN.admiral].n)}: <b class="num">+${cy.mxGain} mastery</b>${cy.mx1>cy.mx0?` <span class="gilt">Level ${cy.mx1} reached: ${esc(MASTERY_PERKS[cy.mx1].n)}. ${esc(MASTERY_PERKS[cy.mx1].d)}</span>`:cy.mx1<4?` <span class="dim">(${masteryXP(RUN.admiral)}/${MASTERY_XP[cy.mx1+1]} to ${esc(nextLv.n)})</span>`:' <span class="dim">(mastered)</span>'}</p></div>`;

    ${NF?`<div class="nextfac"><div class="dim" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase">Next run</div><b>Try the ${esc(NF.n.replace(/^The /,''))}</b><p class="muted" style="margin:4px 0 0">${esc(NF.blurb||'')}</p></div>`:''}`;
  const sub=victory?`Three sectors broken, three flagships burning behind you. ${esc(ADMIRALS[RUN.admiral]?ADMIRALS[RUN.admiral].n:'Your admiral')} brings the ${esc(FACTIONS[RUN.fac]?FACTIONS[RUN.fac].n.replace(/^The /,''):'fleet')} home.`:abandoned?'The fleet stands down. Its deeds are recorded.':'The last hull goes dark in sector '+roman(RUN.sector)+'. The survivors will tell it differently.';
  show(`<div class="screen title recap"><div class="inner" style="max-width:720px">

const MAP_NAME={belt:'asteroid belt',station:'orbital station',planet:'planet edge',storm:'ion storm',graveyard:'ship graveyard'};
function mapScreen(){
  B=null;
