<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- original astromech-style droid for Mission Control: faceted hex dome, visor band, octagonal body. Not a copy of any film droid. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#b9c4ce"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f86c8"/><stop offset="1" stop-color="#1d4f86"/></linearGradient>
  </defs>
  <!-- legs -->
  <path d="M22 70 L14 118 L28 118 L34 76 Z" fill="url(#shell)" stroke="#55626e" stroke-width="1.2"/>
  <path d="M98 70 L106 118 L92 118 L86 76 Z" fill="url(#shell)" stroke="#55626e" stroke-width="1.2"/>
  <rect x="9" y="118" width="24" height="7" rx="1.5" fill="#2a3540" stroke="#55626e"/>
  <rect x="87" y="118" width="24" height="7" rx="1.5" fill="#2a3540" stroke="#55626e"/>
  <path d="M18 104 L30 104 M102 104 L90 104" stroke="#2d6fae" stroke-width="2"/>
  <!-- body: octagon -->
  <path d="M38 58 L82 58 L90 68 L90 112 L82 122 L38 122 L30 112 L30 68 Z" fill="url(#shell)" stroke="#55626e" stroke-width="1.4"/>
  <path d="M42 70 L60 80 L78 70 L78 78 L60 88 L42 78 Z" fill="url(#blue)"/>
  <rect x="44" y="94" width="32" height="5" fill="url(#blue)"/>
  <path d="M44 104 h14 M62 104 h14 M44 110 h32" stroke="#7d8a96" stroke-width="1.2"/>
  <rect x="36" y="64" width="4" height="50" fill="#d4dbe2" stroke="#9aa6b1" stroke-width=".6"/>
  <rect x="80" y="64" width="4" height="50" fill="#d4dbe2" stroke="#9aa6b1" stroke-width=".6"/>
  <!-- neck ring -->
  <rect x="34" y="52" width="52" height="7" fill="#3a4652" stroke="#55626e"/>
  <!-- faceted hex dome -->
  <path d="M34 52 L38 30 L52 18 L68 18 L82 30 L86 52 Z" fill="url(#shell)" stroke="#55626e" stroke-width="1.4"/>
  <path d="M52 18 L56 30 L64 30 L68 18" stroke="#9aa6b1" stroke-width="1"/>
  <path d="M38 30 L56 30 M64 30 L82 30" stroke="#9aa6b1" stroke-width="1"/>
  <!-- visor band -->
  <path d="M37 36 L83 36 L85 46 L35 46 Z" fill="#14324f" stroke="#2d6fae" stroke-width="1.2"/>
  <rect x="44" y="39" width="20" height="4" rx="1" fill="#8fd0f2"/>
  <circle cx="72" cy="41" r="2.4" fill="#ff9f45"/>
  <!-- blue dome plates -->
  <path d="M40 31 L52 21 L54 29 Z" fill="url(#blue)"/>
  <path d="M80 31 L68 21 L66 29 Z" fill="url(#blue)"/>
  <!-- antenna -->
  <path d="M74 20 L80 8" stroke="#55626e" stroke-width="1.6"/><circle cx="80.5" cy="7" r="2" fill="#8fd0f2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
