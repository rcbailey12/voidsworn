<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 Engine Test (Babylon)</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; outline: none; }
  #msg { position: fixed; left: 8px; top: 8px; color: #8a8; font: 12px monospace; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">loading</div>
<script>
// A2 engine test, Babylon.js half. Follows contrib/opus/enginetest/SPEC.md. Nothing here comes from the game's
// fx3d/vfx3d/wfx3d/gfx3d/ships3d code: the effects are built fresh for the test.
//
// Query string:
//   mode=bench|shots   bench: warm-up then the 20 s battle orbit, result JSON on window.__result (shots still
//                      callable afterwards). shots: no bench, window.__shot(name) only.
//   (stills: battle_05, battle_12, battle_126, close_20, breach_30; debug views in window.__debugNames)
//   res=WxH            render size in pixels (default: the window size)
//   seconds=20 warmup=3 msaa=4 gputime=1
//
// Library: Babylon.js 9.30.0 and the matching loaders (bjs=8.20.0 picks the older release for comparison), from
// ./vendor/bjs-<version>/ if present (run.py fills it, so load time does not include a CDN download), otherwise jsDelivr.
(function () {
  var V = new URLSearchParams(location.search).get('bjs') || '9.30.0';
  window.__bjsVersion = V;
  var libs = [
    ['vendor/bjs-' + V + '/babylon.js', 'https://cdn.jsdelivr.net/npm/babylonjs@' + V + '/babylon.js'],
    ['vendor/bjs-' + V + '/babylonjs.loaders.min.js', 'https://cdn.jsdelivr.net/npm/babylonjs-loaders@' + V + '/babylonjs.loaders.min.js']
  ];
  window.__libSource = [];
  function load(i) {
    if (i >= libs.length) { Promise.resolve().then(window.__start).catch(function (e) { window.__error = String(e && e.stack || e); console.error(window.__error); }); return; }
    var tryOne = function (k) {
      var s = document.createElement('script');
      s.src = libs[i][k];
      s.onload = function () { window.__libSource.push(libs[i][k]); load(i + 1); };
      s.onerror = function () {
        if (k === 0) tryOne(1);
        else { window.__error = 'could not load ' + libs[i][1]; console.error(window.__error); }
      };
      document.head.appendChild(s);
    };
    tryOne(0);
  }
  window.addEventListener('DOMContentLoaded', function () { load(0); });
})();
</script>
<script>
window.__start = async function () {
'use strict';
var B = BABYLON;
var Q = new URLSearchParams(location.search);
var MODE = Q.get('mode') || 'bench';
var SECONDS = parseFloat(Q.get('seconds') || '20');
var WARMUP = parseFloat(Q.get('warmup') || '3');
var MSAA = parseInt(Q.get('msaa') || '4', 10);
var GPUTIME = Q.get('gputime') !== '0';
// SPEC.md "Trimmed scope" (overrides the earlier rounds): stress=1 is the 24-ship run (six flagships plus 0.6-scale copies,
// 0.17 s stagger, destruction every 4 s, orbit 190 / 85); ships=40 the headroom crowd (more rows of copies). max=1: the six
// flagships with rich effects (event light pool, soft particles, parallax breaches, raymarched volumes) and Babylon's best
// lighting features (SSAO2, SSR, sky IBL, micro-detail normals, contact shadows, TAA). rich=1: the rich effects alone on the
// 24-ship layout (kept from the ceiling round). vsync=1: the runner left vsync on.
var BOARD = Q.get('board') === '1';   // the game slice: max mode seen from the tactical camera over a hex board, with UI
var MAXM = Q.get('max') === '1' || BOARD, RICH = MAXM || Q.get('rich') === '1', VSYNC = Q.get('vsync') === '1';
var NSHIPS = parseInt(Q.get('ships') || '0', 10);
var STRESS = Q.get('stress') === '1' || (RICH && !MAXM) || NSHIPS >= 24;
NSHIPS = STRESS ? Math.max(24, NSHIPS) : 6;
var ORBIT_R = !STRESS ? 150 : NSHIPS === 24 ? 190 : 150 + 40 * (1 + (NSHIPS - 24) / 12);
var ORBIT_H = !STRESS ? 70 : NSHIPS === 24 ? 85 : ORBIT_R * 0.45;
var PHYS = MAXM;   // push round, trimmed: chunks and debris are Havok rigid bodies in max mode
var MODE_NAME = BOARD ? 'board' : (MAXM ? 'max' : RICH ? 'rich' : '') + (NSHIPS > 24 ? ((MAXM || RICH) ? '_' : '') + 'ships' + NSHIPS : (MAXM && STRESS ? '_stress' : ''));
if (!MODE_NAME) MODE_NAME = STRESS ? 'stress' : 'main';
var msg = document.getElementById('msg');
var say = function (s) { msg.textContent = s; };

// ---------- canvas and engine ----------
var canvas = document.getElementById('c');
var RW = window.innerWidth, RH = window.innerHeight;
if (Q.get('res')) { var r = Q.get('res').toLowerCase().split('x'); RW = parseInt(r[0], 10); RH = parseInt(r[1], 10); }
canvas.style.width = RW + 'px'; canvas.style.height = RH + 'px';
canvas.width = RW; canvas.height = RH;
// webgpu=1: Babylon's WebGPU engine (it turns the GLSL shaders here into WGSL at run time, loading its glslang and twgsl
// helpers from cdn.babylonjs.com). Otherwise WebGL2.
var WEBGPU = Q.get('webgpu') === '1', engine = null;
if (WEBGPU && B.WebGPUEngine) {
  try { if (await B.WebGPUEngine.IsSupportedAsync) { engine = new B.WebGPUEngine(canvas, { antialias: false, stencil: true, powerPreference: 'high-performance' }); await engine.initAsync(); } }
  catch (e) { console.warn('webgpu unavailable, falling back to webgl2', e); engine = null; }
}
if (!engine) engine = new B.Engine(canvas, false, {
  preserveDrawingBuffer: false, stencil: true, powerPreference: 'high-performance', premultipliedAlpha: false
}, false);
var IS_WEBGPU = !!engine.isWebGPU;
engine.setHardwareScalingLevel(1);
engine.setSize(RW, RH);
engine.enableOfflineSupport = false;

var scene = new B.Scene(engine);
scene.useRightHandedSystem = true;          // same handedness as glTF and Godot: x bow, y up, z port, no flips
scene.clearColor = new B.Color4(0, 0, 0, 1);
scene.skipPointerMovePicking = true;
scene.autoClear = true;

// ---------- spec constants ----------
var SHIP_LEN = 24;
var SHIPS = [ // order = effect stagger order
  { fac: 'voidsworn', files: ['V1b_r_23.glb'], x: -45, z: 30, weapon: [1.0, 0.45, 0.15], shield: [1.0, 0.46, 0.16], engine: [1.0, 0.50, 0.16] },
  { fac: 'hegemony', files: ['H4_11.glb'], x: 0, z: 30, weapon: [0.55, 0.82, 1.0], shield: [0.38, 0.68, 1.0], engine: [0.45, 0.72, 1.0] },
  { fac: 'corsair', files: ['C19_51_shell.glb', 'C19_51_kit.glb'], x: 45, z: 30, rotY: Math.PI, weapon: [0.95, 0.22, 0.10], shield: [0.85, 0.16, 0.10], engine: [1.0, 0.38, 0.16] },
  { fac: 'chorus', files: ['B16_23.glb'], x: -45, z: -30, weapon: [0.85, 0.90, 0.30], shield: null, engine: [0.80, 0.90, 0.28] },
  { fac: 'ithar', files: ['I8_37.glb'], x: 0, z: -30, weapon: [0.75, 1.0, 0.88], shield: [0.72, 1.0, 0.86], engine: [0.62, 1.0, 0.84] },
  { fac: 'deathless', files: ['D22_23.glb'], x: 45, z: -30, weapon: [0.20, 1.0, 0.38], shield: null, engine: [0.15, 1.0, 0.35] }
];
// Key light intensity: tuned so the light grey Hegemony hull reads near-white without clipping.
var KEY = 3.2;
var KEY_DIR = new B.Vector3(-0.45, -0.70, -0.55).normalize();
var FILL_DIR = new B.Vector3(0.6, -0.2, 0.75).normalize();

// ---------- camera ----------
var cam = new B.FreeCamera('cam', new B.Vector3(0, 70, 150), scene);
cam.fov = 40 * Math.PI / 180;               // vertical
cam.fovMode = B.Camera.FOVMODE_VERTICAL_FIXED;
cam.minZ = 0.5; cam.maxZ = 2000;
scene.activeCamera = cam;
var ORBIT_LOOK = new B.Vector3(0, -5, 0), STILL_POSE = false;   // stills always use the main orbit (150 / 70) so they line up
function battlePose(t) {                    // t = seconds into the 20 s orbit
  var az = (200 + 120 * Math.min(Math.max(t, 0), 20) / 20) * Math.PI / 180;
  var R = STILL_POSE ? 150 : ORBIT_R, Hh = STILL_POSE ? 70 : ORBIT_H;
  cam.position.set(R * Math.cos(az), Hh, R * Math.sin(az));
  cam.setTarget(ORBIT_LOOK);
}
function closePose() {
  cam.position.set(20, 14, 58);
  cam.setTarget(new B.Vector3(45, 0, 30));
}

// ---------- lights ----------
var key = new B.DirectionalLight('key', KEY_DIR, scene);
key.diffuse = new B.Color3(1.0, 0.96, 0.90); key.specular = key.diffuse.clone(); key.intensity = KEY;
key.position = KEY_DIR.scale(-200);
var fill = new B.DirectionalLight('fill', FILL_DIR, scene);
fill.diffuse = new B.Color3(0.55, 0.65, 0.85); fill.specular = fill.diffuse.clone(); fill.intensity = 0.25 * KEY;
fill.shadowEnabled = false;
// Ambient: neutral, 0.25 of the key. PBR adds ambientColor x albedo x AO, the same shape as Godot's colour ambient.
scene.ambientColor = new B.Color3(0.25 * KEY, 0.25 * KEY, 0.25 * KEY);

// ---------- shadows: one cascade set over the formation ----------
var csm = new B.CascadedShadowGenerator(2048, key);
csm.numCascades = 4;
csm.lambda = 0.75;
csm.shadowMaxZ = 320;
csm.stabilizeCascades = true;
csm.autoCalcDepthBounds = false;
csm.depthClamp = true;
csm.usePercentageCloserFiltering = true;
csm.filteringQuality = B.ShadowGenerator.QUALITY_MEDIUM;
csm.bias = 0.003;
csm.normalBias = 0.02;
if (Q.get('shadows') === '0') key.shadowEnabled = false;   // diagnostics only

// ---------- post: HDR, MSAA, bloom, ACES ----------
// The post chain runs in creation order, so max mode's passes are created first: SSAO2, SSR, contact shadows, dust haze,
// TAA, then the default pipeline (bloom, tone mapping). The rich modes' hull depth pass is created here too.
var depthR = null, depthTex = null, DEPTH_VALS = new B.Vector2(cam.minZ, cam.minZ + cam.maxZ), RES2 = new B.Vector2(RW, RH);
if (RICH) { depthR = scene.enableDepthRenderer(cam, false, true); depthTex = depthR.getDepthMap(); depthTex.renderList = []; }
var ssao = null, ssr = null, taa = null, contactPP = null, hazePP = null, LIGHT_V = new B.Vector3(), TMPV = new B.Vector3();
var HAZE_N = 8, HAZE_L = new Float32Array(HAZE_N * 4), HAZE_C = new Float32Array(HAZE_N * 4);
var OFF = (Q.get('off') || '').split(',');   // diagnostics: off=ssao,ssr,contact,haze,taa,dof
if (MAXM) {
  if (OFF.indexOf('ssao') < 0) try { ssao = new B.SSAO2RenderingPipeline('ssao', scene, { ssaoRatio: 0.5, blurRatio: 0.5 }, [cam], true);
    ssao.radius = 2.0; ssao.totalStrength = 1.1; ssao.samples = 16; ssao.maxZ = 400; ssao.expensiveBlur = true; ssao.base = 0.15; } catch (e) { console.warn('ssao2', e); }
  if (OFF.indexOf('ssr') < 0) try { ssr = new B.SSRRenderingPipeline('ssr', scene, [cam], true, B.Constants.TEXTURETYPE_HALF_FLOAT);
    ssr.strength = 0.8; ssr.reflectivityThreshold = 0.05; ssr.maxDistance = 150; ssr.maxSteps = 120; ssr.step = 1.0; ssr.thickness = 0.8;
    ssr.blurDispersionStrength = 0.02; ssr.roughnessFactor = 0.25; } catch (e) { console.warn('ssr', e); }
  // contact shadows: not built in; a screen-space march toward the key light over the hull depth pass, darkening creases
  B.Effect.ShadersStore.contactFragmentShader = [
    'precision highp float; varying vec2 vUV; uniform sampler2D textureSampler; uniform sampler2D depthMap; uniform vec2 uDepthVals;',
    'uniform vec3 uLightV; uniform float uTanH; uniform float uAspect;',
    'float vd(vec2 uv){ return texture2D(depthMap, uv).r * uDepthVals.y + uDepthVals.x; }',
    'void main(){ vec4 c = texture2D(textureSampler, vUV); float m = texture2D(depthMap, vUV).r; if (m >= 0.999) { gl_FragColor = c; return; }',
    '  float d = vd(vUV); vec2 nd = vUV * 2.0 - 1.0; vec3 p = vec3(nd.x * uTanH * uAspect * d, nd.y * uTanH * d, -d); float occ = 0.0;',
    '  for (int i = 1; i <= 14; i++) { vec3 q = p + uLightV * 0.14 * float(i); float dq = -q.z; if (dq <= 0.1) break;',
    '    vec2 uq = vec2(q.x / (dq * uTanH * uAspect), q.y / (dq * uTanH)) * 0.5 + 0.5; if (uq.x < 0.0 || uq.x > 1.0 || uq.y < 0.0 || uq.y > 1.0) break;',
    '    float df = dq - vd(uq); if (df > 0.03 && df < 0.8) { occ = 1.0 - float(i) / 15.0; break; } }',
    '  gl_FragColor = vec4(c.rgb * (1.0 - 0.45 * occ), c.a); }'].join('\n');
  if (OFF.indexOf('contact') < 0) contactPP = new B.PostProcess('contact', 'contact', ['uDepthVals', 'uLightV', 'uTanH', 'uAspect'], ['depthMap'], 1.0, cam);
  if (contactPP) contactPP.onApply = function (e) { e.setTexture('depthMap', depthTex); e.setVector2('uDepthVals', DEPTH_VALS); e.setVector3('uLightV', LIGHT_V);
    e.setFloat('uTanH', Math.tan(cam.fov / 2)); e.setFloat('uAspect', RW / RH); };
  // dust haze: depth-based thin haze plus analytic in-scattering from the 8 brightest event lights (explosions, flashes, engines)
  B.Effect.ShadersStore.hazeFragmentShader = [
    'precision highp float; varying vec2 vUV; uniform sampler2D textureSampler; uniform sampler2D depthMap; uniform vec2 uDepthVals;',
    'uniform float uTanH; uniform float uAspect; uniform mat4 uCamWorld; uniform vec4 uL[8]; uniform vec4 uC[8]; uniform float uOn;',
    'void main(){ vec4 c = texture2D(textureSampler, vUV); if (uOn < 0.5) { gl_FragColor = c; return; }',
    '  float m = texture2D(depthMap, vUV).r; float d = m >= 0.999 ? 400.0 : m * uDepthVals.y + uDepthVals.x;',
    '  vec2 nd = vUV * 2.0 - 1.0; vec3 dirV = normalize(vec3(nd.x * uTanH * uAspect, nd.y * uTanH, -1.0)); float L = d / max(-dirV.z, 1e-3); L = min(L, 260.0);',
    '  vec3 ro = (uCamWorld * vec4(0.0, 0.0, 0.0, 1.0)).xyz; vec3 rd = normalize((uCamWorld * vec4(dirV, 0.0)).xyz);',
    '  float thick = 1.0 - exp(-L * 0.0012); vec3 hz = vec3(0.30, 0.24, 0.22) * 0.012 * thick;',
    '  for (int i = 0; i < 8; i++) { if (uL[i].w <= 0.0) continue; vec3 P = uL[i].xyz - ro; float t0 = dot(P, rd); float h2 = max(dot(P, P) - t0 * t0, 0.5); float h = sqrt(h2);',
    '    float sc = (atan((L - t0) / h) - atan(-t0 / h)) / max(h, 2.0); hz += uC[i].rgb * uL[i].w * sc * 0.012; }',
    '  gl_FragColor = vec4(c.rgb + hz, c.a); }'].join('\n');
  if (OFF.indexOf('haze') < 0) hazePP = new B.PostProcess('haze', 'haze', ['uDepthVals', 'uTanH', 'uAspect', 'uCamWorld', 'uL', 'uC', 'uOn'], ['depthMap'], 1.0, cam);
  if (hazePP) hazePP.onApply = function (e) { e.setTexture('depthMap', depthTex); e.setVector2('uDepthVals', DEPTH_VALS); e.setFloat('uTanH', Math.tan(cam.fov / 2));
    e.setFloat('uAspect', RW / RH); e.setMatrix('uCamWorld', cam.getWorldMatrix()); e.setFloatArray4('uL', HAZE_L); e.setFloatArray4('uC', HAZE_C); e.setFloat('uOn', ENV.ok ? 1 : 0); };
  // TAA: Babylon's reprojection needs the prepass renderer, which the custom effect shaders do not write, so it stays off:
  // TAA accumulates while the camera holds still (the stills) and switches itself off while the camera moves.
  if (OFF.indexOf('taa') < 0) try { taa = new B.TAARenderingPipeline('taa', scene, [cam]); taa.samples = 8; taa.disableOnCameraMove = true; taa.clampHistory = true; } catch (e) { console.warn('taa', e); }
}
var pipe = new B.DefaultRenderingPipeline('post', true, scene, [cam]);
pipe.samples = MAXM ? 1 : MSAA;
pipe.fxaaEnabled = false;
pipe.bloomEnabled = true;
pipe.bloomThreshold = 0.8;
pipe.bloomWeight = 0.35;
// Babylon's blur kernel is in pixels, so scale it with the height to keep the same glow size at every resolution
// (64 at 1440p, 96 at 2160p), the way Godot's mip-based glow behaves.
pipe.bloomKernel = Math.max(16, Math.round(64 * RH / 1440));
pipe.bloomScale = 0.5;
pipe.imageProcessingEnabled = true;
pipe.imageProcessing.toneMappingEnabled = true;
pipe.imageProcessing.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
pipe.imageProcessing.exposure = 1.0;
pipe.imageProcessing.contrast = 1.0;
pipe.imageProcessing.vignetteEnabled = false;
function dofNeutral() { if (!pipe.depthOfFieldEnabled) return; pipe.depthOfField.fStop = 32; pipe.depthOfField.focalLength = 20; pipe.depthOfField.focusDistance = 150000; }
if (MAXM && !BOARD && OFF.indexOf('dof') < 0) {   // DoF is switched on once here (toggling it later rebuilds the chain); battle shots keep it neutral
  pipe.depthOfFieldEnabled = true; pipe.depthOfFieldBlurLevel = B.DepthOfFieldEffectBlurLevel.Medium; dofNeutral();
}
if (MAXM) {   // presentation: colour grading with Babylon's built-in curves (cool shadows, warm highlights, a little saturation)
  var curves = new B.ColorCurves(); curves.globalSaturation = 12; curves.shadowsHue = 205; curves.shadowsDensity = 25; curves.shadowsSaturation = 30;
  curves.highlightsHue = 35; curves.highlightsDensity = 20; curves.highlightsSaturation = 25; curves.midtonesSaturation = 5;
  pipe.imageProcessing.colorCurvesEnabled = true; pipe.imageProcessing.colorCurves = curves;
}

// ---------- shared shader bits ----------
var NOISE = [
  'float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }',
  'float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
  '  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }',
  'float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }'
].join('\n');
var HIDE = 'gl_Position = vec4(2.0, 2.0, 2.0, 1.0);';

// ---------- sky: equirectangular starfield ----------
// Mapping matches Godot's PanoramaSkyMaterial: u = atan(x, -z) / 2pi (wrapped to 0..1), v = acos(y) / pi, v = 0 is the
// top row of the PNG. The PNG is sRGB; it is decoded to linear here and tone mapped with the rest of the frame.
B.Effect.ShadersStore.skyVertexShader = [
  'precision highp float; attribute vec3 position; uniform mat4 world; uniform mat4 viewProjection; varying vec3 vDir;',
  'void main(){ vDir = position; gl_Position = viewProjection * world * vec4(position, 1.0); }'].join('\n');
B.Effect.ShadersStore.skyFragmentShader = [
  'precision highp float; varying vec3 vDir; uniform sampler2D sky;',
  'vec3 lin(vec3 c){ return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }',
  'void main(){ vec3 d = normalize(vDir); float u = atan(d.x, -d.z) / 6.2831853; u = u < 0.0 ? u + 1.0 : u;',
  '  float v = acos(clamp(d.y, -1.0, 1.0)) / 3.1415927; gl_FragColor = vec4(lin(texture2D(sky, vec2(u, v)).rgb), 1.0); }'].join('\n');
// SPEC.md "Environment": max and board modes use assets/env/ when it is there (dead-star sky, asteroid field, dust haze),
// otherwise they fall back to the plain starfield and no rocks.
var ENV = { ok: false, sky: false, rocks: null };
async function exists(u) { try { var r = await fetch(u, { method: 'HEAD', cache: 'no-store' }); return r.ok; } catch (e) { return false; } }
if (MAXM) {   // run.py says which env files are on disk (envsky=1, envrocks=1), so the page never asks for a missing file
  ENV.sky = Q.get('envsky') === '1';
  if (Q.get('envrocks') === '1') { try { ENV.rocks = await (await fetch('../assets/env/asteroids.json', { cache: 'no-store' })).json(); } catch (e) { console.warn('asteroids.json', e); } }
  ENV.ok = ENV.sky || !!ENV.rocks;
}
var skyTex = new B.Texture(ENV.sky ? '../assets/env/sky_deadstar_8k.png' : '../starfield_4k.png', scene, true, false, B.Texture.BILINEAR_SAMPLINGMODE);
skyTex.wrapU = B.Texture.WRAP_ADDRESSMODE; skyTex.wrapV = B.Texture.CLAMP_ADDRESSMODE;
var skyMat = new B.ShaderMaterial('skyMat', scene, { vertex: 'sky', fragment: 'sky' },
  { attributes: ['position'], uniforms: ['world', 'viewProjection'], samplers: ['sky'] });
skyMat.setTexture('sky', skyTex);
skyMat.backFaceCulling = false; skyMat.disableDepthWrite = true;
var skyBox = B.MeshBuilder.CreateBox('sky', { size: 1000 }, scene);
skyBox.material = skyMat; skyBox.infiniteDistance = true; skyBox.renderingGroupId = 0; skyBox.isPickable = false;

// ---------- load the ships ----------
say('loading ships');
var skyReady = new Promise(function (res) { if (skyTex.isReady()) res(); else skyTex.onLoadObservable.addOnce(function () { res(); }); });
var shipMeshes = [];
async function loadShip(def, i) {
  var conts = await Promise.all(def.files.map(function (f) {
    return B.SceneLoader.LoadAssetContainerAsync('../assets/', f, scene);
  }));
  var pivot = new B.TransformNode('ship_' + def.fac, scene);
  var spin = new B.TransformNode('spin_' + def.fac, scene); spin.parent = pivot;
  var off = new B.TransformNode('off_' + def.fac, scene); off.parent = spin;
  var meshes = [];
  conts.forEach(function (c) {
    c.addAllToScene();
    c.meshes.forEach(function (m) { if (!m.parent) m.parent = off; if (m.getTotalVertices() > 0) meshes.push(m); });
    c.materials.forEach(function (mat) {
      if (!(mat instanceof B.PBRMaterial)) return;
      mat.ambientColor = new B.Color3(1, 1, 1);
      // Only the unpainted barge test exports have no material; glTF's default (metal 1, rough 1) would render
      // them black without an environment map. The painted PC files carry their own materials.
      if (mat.name === '__GLTFLoader._default') { mat.metallic = 0.0; mat.roughness = 0.75; }
    });
  });
  // bounds in the file's own frame (everything is identity at this point)
  pivot.computeWorldMatrix(true);
  var lo = new B.Vector3(1e9, 1e9, 1e9), hi = lo.scale(-1);
  meshes.forEach(function (m) {
    m.computeWorldMatrix(true); m.refreshBoundingInfo(); var bb = m.getBoundingInfo().boundingBox;
    lo = B.Vector3.Minimize(lo, bb.minimumWorld); hi = B.Vector3.Maximize(hi, bb.maximumWorld);
  });
  var c = lo.add(hi).scale(0.5), size = hi.subtract(lo);
  var s = SHIP_LEN / size.x;
  off.position = c.scale(-1);
  spin.rotation.y = def.rotY || 0;

    var pArr = Array.prototype.slice.call(fp, 0, n), pSum = pArr.reduce(function (a, b) { return a + b; }, 0), pMax = pArr.reduce(function (a, b) { return Math.max(a, b); }, 0);
    window.__result = {
      engine: 'babylon', renderer: IS_WEBGPU ? 'webgpu' : engine.webGLVersion >= 2 ? 'webgl2' : 'webgl1', mode: MODE_NAME,
      width: engine.getRenderWidth(), height: engine.getRenderHeight(), seconds: SECONDS, frames: n,
      avg_ms: r3(sum / n), p99_ms: r3(worst / k), max_ms: r3(sorted[0]), fps_avg: r3(n / (sum / 1000)),
      load_s: r3(loadS), gpu_mem_mb: null,
      notes: '',
      vsync: VSYNC, refresh_hz: vs ? vs.refresh_hz : null, dropped_frames: vs ? vs.dropped_frames : null, dropped_pct: vs ? vs.dropped_pct : null,
      physics_step_avg_ms: pMax > 0 ? r3(pSum / n) : null, physics_step_max_ms: pMax > 0 ? r3(pMax) : null,
