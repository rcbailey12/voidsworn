# Issue 1487 (audit GH-04, GH-11): one place for the Godot version every checks.yml job uses. The download is cached:
# cache_warm.yml saves it on main, and every branch can read main's cache. Branches only read (actions/cache/restore), so
# they never store a copy of their own; on a miss they download as before. Sets GODOT for the steps after it.
# Upgrading Godot: change the version in the three lines below, nothing else.
name: Get Godot (headless)
description: Restore Godot from main's cache or download it, and set GODOT.
runs:
  using: composite
  steps:
    - name: Godot from main's cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ~/godot-4.7.2
        key: godot-4.7.2-stable-linux-x86_64
    - name: Download Godot 4.7.2 (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -sSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot-4.7.2
        rm -f "$RUNNER_TEMP/godot.zip"
    - name: Save Godot to the cache (main only)
      if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/godot-4.7.2
        key: godot-4.7.2-stable-linux-x86_64
    - name: Set GODOT
      shell: bash
      run: |
        echo "GODOT=$HOME/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
        "$HOME/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" --headless --version
