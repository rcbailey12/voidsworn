# Automatic checks on every agent branch (Ryan, Nov 2 2026, FINDINGS R75). One run per push since issue 359.
# Every push to a codex/, muse/, work/ or opus/ branch gets a pass or fail mark on its head commit, and the pull request
# of that branch shows it, before the Board reviews it.
# Why this starts on "push" and not on "pull_request" (Nov 10 2026): auto_pr.yml opens the pull request with GitHub's own
# token, and GitHub holds every pull_request run of a bot-opened pull request until a person approves it. Nobody did, so
# that run never started a job, and when the pull request was merged it turned into a failed run with no jobs: one
# failure email per pull request. auto_pr.yml started a second run by hand to get round that, so every later push ran
# all the checks twice. A push made with a person's token (the PC, Muse, a Claude thread) starts this workflow once.
# A branch with any other name gets no automatic run: open its pull request by hand and start the checks by hand
# (Actions tab, "checks", "Run workflow", pick the branch; or: gh workflow run checks.yml --ref <branch>).
# Each job merges main into its checkout first, so it tests what would land, as the old pull_request runs did.
name: checks
on:
  push:
    branches:
      - 'codex/**'
      - 'muse/**'
      - 'work/**'
      - 'opus/**'
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standing-checks:
    name: Standing checks (rules, text, saves)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Test what would land: main merged into the branch. If they conflict, the checks run on the branch alone and say so
      # (GitHub will not merge a conflicting pull request anyway; merging main into the branch and pushing runs them again).
      - name: Merge main in (test the branch as it would land)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "checks"; git config user.email "checks@users.noreply.github.com"
          if git merge -q --no-edit origin/main; then
            echo "Testing ${GITHUB_SHA::7} merged with main $(git rev-parse --short origin/main)."
          else
            git merge --abort 2>/dev/null || true
            echo "::warning::main could not be merged into this branch (a conflict), so these checks ran on the branch alone. Merge main into the branch and push again."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No em dashes in changed text files (house rule)
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/main...HEAD | grep -E '\.(md|txt|js|gd|json|bat|py)$' || true)
          bad=""
          for f in $files; do [ -f "$f" ] && grep -l "$(printf '\342\200\224')" "$f" && bad="$bad $f"; done
          if [ -n "$bad" ]; then echo "Em dashes found in:$bad"; exit 1; fi
          echo "No em dashes in changed files."
      - name: Run all standing checks
        run: node contrib/opus/tools/run_all_checks.js
  godot-parity:
    name: Godot rules parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Test what would land: main merged into the branch. If they conflict, the checks run on the branch alone and say so
      # (GitHub will not merge a conflicting pull request anyway; merging main into the branch and pushing runs them again).
      - name: Merge main in (test the branch as it would land)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "checks"; git config user.email "checks@users.noreply.github.com"
          if git merge -q --no-edit origin/main; then
            echo "Testing ${GITHUB_SHA::7} merged with main $(git rev-parse --short origin/main)."
          else
            git merge --abort 2>/dev/null || true
            echo "::warning::main could not be merged into this branch (a conflict), so these checks ran on the branch alone. Merge main into the branch and push again."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get Godot 4.7.2 (headless)
        id: godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      # The Godot checks below each run even when an earlier one fails, so one red run shows every failure.
      # Each script prints PASS or FAIL and exits 1 on any FAIL, which fails this job and the PR (issue #264).
      - name: Rules parity against the browser game
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: sh godot/rules/test/run_parity.sh
      - name: Campaign parity (30 seeded runs, same as tools/pc/parity_campaign.bat)
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: sh godot/campaign/test/run_parity_campaign.sh 1 30
      - name: Tree hand-off (campaign picks reach the battle)
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: '"$GODOT" --headless --path godot --script res://campaign/test/tree_handoff_test.gd'
      - name: Nemesis scenarios (JS game and Godot, record by record)
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: sh godot/campaign/test/run_nem_scenarios.sh
  # Issue 359: GitHub opens the game the player sees (the battle scene, HUD, effects, world, story), not only the rules.
  # Its own job, so it runs beside the parity job and has its own 30 minute limit. Ship files (godot/gen) are never on
  # GitHub: ships are placeholder blocks.
  # The load step is the gate: when a script or scene does not load, the job fails there in seconds and names the file,
  # and the steps after it do not run (they would only repeat the same error, some by waiting out their time limits).
  # When everything loads, the list step and the bot battle each run even if the other fails. Every step has its own
  # time limit and the limits add up to under 27 minutes, so the job ends red by itself and is never cut off (shown as
  # "cancelled") by the 30 minute limit: that happened on the broken test commit 138ff38.
  godot-game:
    name: Godot game checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.godot_user   # user:// for every Godot run here; never a real profile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Test what would land: main merged into the branch. If they conflict, the checks run on the branch alone and say so
      # (GitHub will not merge a conflicting pull request anyway; merging main into the branch and pushing runs them again).
      - name: Merge main in (test the branch as it would land)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "checks"; git config user.email "checks@users.noreply.github.com"
          if git merge -q --no-edit origin/main; then
            echo "Testing ${GITHUB_SHA::7} merged with main $(git rev-parse --short origin/main)."
          else
            git merge --abort 2>/dev/null || true
            echo "::warning::main could not be merged into this branch (a conflict), so these checks ran on the branch alone. Merge main into the branch and push again."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get Godot 4.7.2 (headless)
        id: godot
        run: |
          curl -sSL --retry 3 --retry-all-errors -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      # (a) typo insurance: compiles every .gd file and loads every .tscn under godot/ (nothing runs). No asset import is
      # needed: no script or scene preloads a texture or sound. Fails on any file that does not load and on any SCRIPT ERROR.
      - name: Load every Godot script and scene (typo check)
        id: load
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: |
          timeout -k 10 120 "$GODOT" --headless --path godot --script res://tools/ci/load_all.gd 2>&1 | tee "$RUNNER_TEMP/load_all.log"; code=${PIPESTATUS[0]}
          { echo '### Load every Godot script and scene'; echo '```'; grep -E '^load all:' "$RUNNER_TEMP/load_all.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          if grep -q 'SCRIPT ERROR' "$RUNNER_TEMP/load_all.log"; then echo "SCRIPT ERROR lines above"; bad=1; fi
          if [ $code -ne 0 ]; then echo "load_all.gd ended with exit code $code (124 or 137 is its 120 s time limit)"; bad=1; fi
          if [ $bad -ne 0 ]; then
            echo 'The Godot checks after this step were not run: a file above does not load. Repair it first.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # The game's fonts, crests, world and effect textures, imported as the editor would, so the checks below draw with
      # them. Left out to keep this short (none is preloaded; the scripts load them at run time and carry on without them):
      # music, audio, the painted portraits and fx/test results. This step never fails the job by itself.
      - name: Import the game's fonts and textures (headless)
        id: import
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        continue-on-error: true
        run: |
          skip="godot/music godot/audio godot/fx/test godot/portraits/nemesis godot/portraits/alts godot/portraits/sheets godot/portraits/painted"
          for d in $skip; do touch "$d/.gdignore"; done
          timeout -k 10 300 "$GODOT" --headless --path godot --import > "$RUNNER_TEMP/import.log" 2>&1 || echo "import exit code $?"
          for d in $skip; do rm -f "$d/.gdignore"; done
          echo "imported files: $(find godot/.godot/imported -type f | wc -l)"
      # (b) every headless check named in godot/tools/ci/godot_checks.txt (the list also proves it names every test script).
      # run_checks.sh keeps the whole list inside a 780 s budget; a check the budget never reached counts as failed.
      - name: Headless Godot checks from the list (godot/tools/ci/godot_checks.txt)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: |
          sh godot/tools/ci/run_checks.sh 2>&1 | tee "$RUNNER_TEMP/run_checks.log"; code=${PIPESTATUS[0]}
          { echo '### Godot checks from the list'; echo '```'; grep -E '^  [a-z0-9_]+: |^  list: |^Ran |^PASS|^FAIL' "$RUNNER_TEMP/run_checks.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      # (c) one battle reached from a real campaign start, played to its end by the game's AI on both sides in the real
      # battle scene. Fails on any script error and on any "unknown event" line. Fixed seed, no retry. The driver stops
      # itself at the first script error and at 300 s; the 360 s limit here is the backstop.
      - name: Bot battle from a real campaign start (seed 359)
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: |
          timeout -k 10 360 "$GODOT" --headless --path godot --script res://tools/ci/bot_battle.gd -- --seed 359 2>&1 | tee "$RUNNER_TEMP/bot_battle.log"; code=${PIPESTATUS[0]}
          { echo '### Bot battle'; echo '```'; grep '^bot battle:' "$RUNNER_TEMP/bot_battle.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'SCRIPT ERROR|unknown event' "$RUNNER_TEMP/bot_battle.log"; then echo "SCRIPT ERROR or unknown event lines above"; exit 1; fi
          exit $code
      # (d) the unpainted A16 fixture that fx/test/death_seam_check.gd falls back to is fresh: the sha256 of every file that makes
      # its geometry matches its record (tools/recipe/sheet_fixture_hash.py; Muse's check of PR 611, BLOCKING 1). Plain Python, no
      # Blender: a PR that changes an input without regenerating the fixture fails here by name.
      - name: A16 death fixture is fresh (sheet_fixture_hash.py --check)
        if: ${{ !cancelled() }}
        run: |
          python3 tools/recipe/sheet_fixture_hash.py --check | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}
