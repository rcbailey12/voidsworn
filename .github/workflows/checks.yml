# Automatic checks on every pull request (Ryan, Nov 2 2026, FINDINGS R75).
# Every PR from Muse, Codex or anyone else gets a pass or fail mark before Opus reviews it.
name: checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standing-checks:
    name: Standing checks (rules, text, saves)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No em dashes in changed text files (house rule)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD | grep -E '\.(md|txt|js|gd|json|bat|py)$' || true)
          bad=""
          for f in $files; do [ -f "$f" ] && grep -l "$(printf '\342\200\224')" "$f" && bad="$bad $f"; done
          if [ -n "$bad" ]; then echo "Em dashes found in:$bad"; exit 1; fi
          echo "No em dashes in changed files."
      - name: Run all standing checks
        run: node contrib/opus/tools/run_all_checks.js
  godot-parity:
    name: Godot rules parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get Godot 4.7.2 (headless)
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Rules parity against the browser game
        run: sh godot/rules/test/run_parity.sh
