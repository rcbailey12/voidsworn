# Nightly: regenerate contrib/opus/OPEN_WORK.md from GitHub (issue 890, Ryan R291: global fixes, not hand edits of stale
# status lines). When the page changed (the GENERATED stamp line aside), it is committed to opus/open-work-nightly
# (force-updated from main each time) and a pull request is opened if none is open. The Board reviews and merges.
# A push made with this workflow's own token starts no other workflow, so checks.yml does not run on that branch;
# the change is one generated Markdown page.
name: open-work-nightly
on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC, 03:17 CST
  workflow_dispatch:
concurrency:
  group: open-work-nightly
  cancel-in-progress: false
permissions:
  contents: write
  issues: read          # without it the issues list holds only pull requests and every seat reads empty (Nov 16)
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: opus/open-work-nightly
      PAGE: contrib/opus/OPEN_WORK.md
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the page from the GitHub REST API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The script writes nothing to stdout on failure, so a failed run never replaces the page.
          node contrib/opus/tools/gen_open_work.js > "$RUNNER_TEMP/open_work.md"
          if diff -q <(grep -v '^GENERATED ' "$PAGE") <(grep -v '^GENERATED ' "$RUNNER_TEMP/open_work.md") > /dev/null; then
            echo "OPEN_WORK.md is unchanged apart from its stamp: nothing to commit."
            echo "CHANGED=0" >> "$GITHUB_ENV"
          else
            cp "$RUNNER_TEMP/open_work.md" "$PAGE"
            echo "CHANGED=1" >> "$GITHUB_ENV"
          fi
      - name: Commit to the nightly branch and open a pull request if none is open
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$PAGE"
          git commit -q -m "OPEN_WORK.md: nightly regeneration from GitHub (issue 890 workflow)"
          git push --force origin "$BRANCH"
          open=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq 'length')
          if [ "$open" = "0" ]; then
            # No issue reference here: a nightly mention would fill issue 890's timeline.
            printf '%s\n' "The nightly workflow (.github/workflows/open_work_nightly.yml, issue 890) regenerated contrib/opus/OPEN_WORK.md from GitHub. One generated page, no other file. The Board reviews and merges." > body.md
            gh api "repos/$REPO/pulls" -f head="$BRANCH" -f base=main \
              -f title="OPEN_WORK.md: nightly live status from GitHub" -F body=@body.md --jq '.html_url'
          else
            echo "A pull request for $BRANCH is already open; the force push updated it."
          fi
