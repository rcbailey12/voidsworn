# Audit 706 finding 4: PR body guards cannot catch closing words in commits that land on main.
# This reports the offending commits after a push; it cannot undo an issue GitHub already closed.
# The logic and its tests: contrib/opus/tools/main_commit_lint.js and main_commit_lint_tests.js (issue 1488).
name: Main commit message lint
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  standing-issues:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Issue 1488 (audit GH-06): read the pushed commits from the REST compare API instead of cloning all history.
      # Only the lint script and auto_pr.yml (its STANDING list) are checked out.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.after }}
          fetch-depth: 1
          sparse-checkout: |
            contrib/opus/tools/main_commit_lint.js
            .github/workflows/auto_pr.yml
          sparse-checkout-cone-mode: false
      - name: Reject closing words before standing issues in every pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: node contrib/opus/tools/main_commit_lint.js
