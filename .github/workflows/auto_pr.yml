# Open a pull request automatically when an agent pushes a job branch (Ryan, Nov 2 2026, FINDINGS R75).
# Nov 7 2026 (R110): the PR title comes from the issue, not the head commit (a branch created from main
# used to copy main's last commit as the title, which mislabelled PRs #203 and #204). work/issue-<n>[-arm]
# is the workhorse branch pattern (#217).
# Codex on Ryan's PC (codex/issue-<n>), Muse (muse/issue-<n>) and Claude worker threads (opus/issue-<n>, issue 359) only need to push; this opens the PR into main
# and starts the checks on it. Opus reviews and merges.
name: auto-pr
on:
  push:
    branches:
      - 'codex/issue-*'
      - 'muse/issue-*'
      - 'work/issue-*'
      - 'opus/issue-*'   # Claude worker branches (issue 359); '*' also matches the arm shape opus/issue-<n>-<arm>
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open the PR if there isn't one, then run the checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.head_commit.message }}
        run: |
          n=$(printf '%s' "$BRANCH" | sed -E 's/.*issue-([0-9]+).*/\1/')
          arm=$(printf '%s' "$BRANCH" | sed -E 's/.*issue-[0-9]+-?//')
          open=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            ititle=$(gh api "repos/$REPO/issues/$n" --jq .title 2>/dev/null || true)
            if [ -n "$ititle" ]; then title="Issue $n: $ititle"; else title=$(printf '%s\n' "$TITLE" | head -1); fi
            if [ -n "$arm" ]; then title="$title [$arm arm]"; fi
            body=$(printf '%s\n' "$TITLE" | tail -n +2)
            printf '%s\n\nOpened automatically from branch %s. Opus reviews and merges.\n' "$body" "$BRANCH" > body.md
            # Claude-built work (opus/) gets an outside check before its issue may close, and standing issues stay open
            # through every merge (256 is the outside-check issue; it was closed by merges twice on Nov 10): those PRs say
            # "Refs #N", never a closing word. Add a standing issue to STANDING, space separated.
            STANDING="256"
            word="Closes"
            case "$BRANCH" in opus/*) word="Refs" ;; esac
            case " $STANDING " in *" $n "*) word="Refs" ;; esac
            if [ "$word" = "Refs" ]; then
              # any case, with or without a colon: GitHub reads "CLOSES #N" and "Closes: #N" as closing words too
              sed -i -E "s/\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#$n\b/Refs #$n/Ig" body.md
              grep -q "Refs #$n" body.md || printf '\nRefs #%s\n' "$n" >> body.md
            else
              grep -q "Closes #$n" body.md || printf '\nCloses #%s\n' "$n" >> body.md
            fi
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$title" --body-file body.md
          else
            echo "PR already open for $BRANCH"
          fi
          gh workflow run checks.yml -R "$REPO" --ref "$BRANCH"
