# Open a pull request automatically when an agent pushes a job branch (Ryan, Nov 2 2026, FINDINGS R75).
# Nov 7 2026 (R110): the PR title comes from the issue, not the head commit (a branch created from main
# used to copy main's last commit as the title, which mislabelled PRs #203 and #204). work/issue-<n>[-arm]
# is the workhorse branch pattern (#217).
# Codex on Ryan's PC (codex/issue-<n>), Muse (muse/issue-<n>) and Claude worker threads (opus/issue-<n>, issue 359) only need to push; this opens the PR into main.
# Neon (neon/issue-<n>, R363) the same.
# The same push starts checks.yml by itself, once (issue 359). This file no longer starts the checks: doing both ran them
# twice on every push. The Board reviews and merges.
name: auto-pr
on:
  push:
    branches:
      - 'codex/issue-*'
      - 'muse/*'         # every one-level Muse branch (muse/<name>; a nested muse/a/b gets none) (Nov 17 audit fix D: muse/look-pass-726 and
                         # muse/glasswright-family sat with no PR); a scratch branch named muse/wip-<anything> opts out
      - 'work/issue-*'
      - 'opus/issue-*'   # Claude worker branches (issue 359); '*' also matches the arm shape opus/issue-<n>-<arm>
      - 'neon/issue-*'   # Neon (Google AI Pro, GitHub account rcbailey12fortnite-stack, Nov 20 2026, R363): outside reviews into contrib/neon/
      # A run the PC runner marks partial (the agent stopped at the time cap or exited with an error, issue 377) pushes to
      # <branch>-partial and must open no pull request. A '!' pattern after the patterns above takes those branches back out.
      - '!codex/issue-*-partial'
      - '!work/issue-*-partial'
      - '!opus/issue-*-partial'
      - '!neon/issue-*-partial'
      - '!muse/wip-*'
      # Keep these '!' lines in step with checks.yml (issue 1488); contrib/opus/tools/workflow_config_tests.js checks both.
# One run at a time per branch, in order (never cancelled): Muse pushes a new branch and its first commit a second apart,
# and two runs racing each other both saw no pull request, so the slower one failed on 'already exists' (Nov 10, PR 409).
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    # A hung gh call used to hold a runner for the default 360 minutes (issue 1488, audit GH-06).
    timeout-minutes: 5
    steps:
      - name: Open the PR if there isn't one (the push itself starts the checks)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          # Standing issues never close on a merge (256 is the outside-check issue, 906 Artoo's standing technical sweep, issue
          # 1488). One list for both paths below (opus_check_594) and for main_commit_lint.yml.
          STANDING: '256 906'
        run: |
          # Second line of defence for partial runs (issue 377): never open a pull request for a -partial branch.
          case "$BRANCH" in *-partial) echo "partial run branch $BRANCH: no pull request (issue 377)"; exit 0 ;; esac
          # Any closing word before ANY standing issue becomes "Refs", whichever branch or issue the PR is for (opus_check_594
          # condition 1: a runner commit saying "Closes #256" on another issue's branch would close 256 on merge).
          guard_standing() {
            for s in $STANDING; do
              sed -i -E "s/\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#$s\b/Refs #$s/Ig" body.md
            done
          }
          shorten_checks() {
            LC_ALL=C awk -v issue="$n" -v keep="$1" '
              { lines[NR] = $0 }
              END {
                for (i = 1; i <= NR; i++) {
                  if (lines[i] == "## Checks run by the runner" && lines[i+1] == "" && lines[i+2] == "```") {
                    first = i + 3
                    fenced = 1
                    break
                  }
                  if (lines[i] == "Runner checks:" && lines[i+1] == "" && lines[i+2] ~ /^checks_(node|parity)\.txt$/) {
                    first = i + 2
                    break
                  }
                }
                for (i = first; first && i <= NR; i++) {
                  if (fenced && lines[i] == "```" && lines[i+1] == "" && lines[i+2] == "## Run stats (runner)") {
                    last = i - 1
                    break
                  }
                  if (!fenced && lines[i] == "## Runner (issue 377)") break
                  if (!fenced && tolower(lines[i]) ~ ("^refs #" issue "[[:space:]]*$")) last = i - 1
                }
                while (last >= first && first && lines[last] ~ /^[[:space:]]*$/) last--
                cut = last - first + 1 - 2 * keep
                for (i = 1; i <= NR; i++) {
                  if (first && cut > 0 && i == first + keep) {
                    print "(" cut " check lines cut. Full log is in the head commit message.)"
                    i += cut
                  }
                  if (i <= NR) print lines[i]
                }
              }' body.md > body-short.md
          }
          limit_body() {
            local limit=64999
            if [ "$(wc -c < body.md)" -le "$limit" ]; then return; fi
            shorten_checks 40
            if [ "$(wc -c < body-short.md)" -gt "$limit" ]; then
              # A few very wide log lines can make even the excerpt too long.
              shorten_checks 0
            fi
            mv body-short.md body.md
            if [ "$(wc -c < body.md)" -le "$limit" ]; then return; fi

            # If the report itself is too long, reserve room for its issue links.
            {
              printf '\n\n(Report cut to fit. Full text is in the head commit message.)\n\n'
              LC_ALL=C awk -v issue="$n" '
                {
                  line = $0
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                  if (split(line, words, /[[:space:]]+/) != 2) next
                  directive = tolower(words[1])
                  # A branch with no issue number (issue-less Muse branch): keep every valid issue link the report names.
                  if (issue == "") {
                    if (words[2] ~ /^#[0-9]+$/ && directive ~ /^(refs|close[sd]?|fix(e[sd])?|resolve[sd]?):?$/ && !(line in seen)) {
                      seen[line] = 1
                      kept[++k] = words[1] " " words[2]
                    }
                    next
                  }
                  if (words[2] != "#" issue) next
                  if (directive ~ /^refs:?$/) refs = words[1] " " words[2]
                  if (directive ~ /^(close[sd]?|fix(e[sd])?|resolve[sd]?):?$/) closes = words[1] " " words[2]
                }
                END {
                  if (issue == "") { for (i = 1; i <= k; i++) print kept[i]; exit }
                  if (refs != "") print refs
                  if (closes != "") print closes
                  if (refs == "" && closes == "") print "Refs #" issue
                }' body.md
            } > body-end.md
            # Remove any incomplete UTF-8 character at the byte cut.
            head -c "$((limit - $(wc -c < body-end.md)))" body.md |
              LC_ALL=C sed -E '$s/[\xc2-\xdf]$|[\xe0-\xef][\x80-\xbf]{0,1}$|[\xf0-\xf4][\x80-\xbf]{0,2}$//' > body-short.md
            cat body-end.md >> body-short.md
            mv body-short.md body.md
          }
          # Read large messages from the payload rather than passing them in the process environment.
          TITLE=$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH")
          # A Muse branch without issue-<n> in its name (Nov 17 audit fix D) gets a PR titled from its commit and no closing word.
          n=""; arm=""
          if printf '%s' "$BRANCH" | grep -qE 'issue-[0-9]+'; then
            n=$(printf '%s' "$BRANCH" | sed -E 's/.*issue-([0-9]+).*/\1/')
            arm=$(printf '%s' "$BRANCH" | sed -E 's/.*issue-[0-9]+-?//')
          fi
          # REST calls only, never the GraphQL-backed gh pr commands (RULEBOOK 2.5, issue 1488).
          open_prs() { gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq "$1"; }
          open=$(open_prs 'length')
          if [ "$open" = "0" ]; then
            ititle=""
            [ -n "$n" ] && ititle=$(gh api "repos/$REPO/issues/$n" --jq .title 2>/dev/null || true)
            if [ -n "$ititle" ]; then title="Issue $n: $ititle"; else title=$(printf '%s\n' "$TITLE" | head -1); fi
            if [ -n "$arm" ]; then title="$title [$arm arm]"; fi
            body=$(printf '%s\n' "$TITLE" | tail -n +2)
            printf '%s\n\nOpened automatically from branch %s. The Board reviews and merges.\n' "$body" "$BRANCH" > body.md
            # Claude-built work (opus/) gets an outside check before its issue may close, and standing issues stay open
            # through every merge (256 is the outside-check issue; it was closed by merges twice on Nov 10): those PRs say
            # "Refs #N", never a closing word. Add a standing issue to STANDING (the step env above), space separated.
            word="Closes"
            case "$BRANCH" in opus/*) word="Refs" ;; esac
            [ -z "$n" ] && word="none"
            case " $STANDING " in *" $n "*) word="Refs" ;; esac
            if [ "$word" = "none" ]; then
              : # no issue number in the branch name: the commit text says what it refers to
            elif [ "$word" = "Refs" ]; then
              # any case, with or without a colon: GitHub reads "CLOSES #N" and "Closes: #N" as closing words too
              sed -i -E "s/\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#$n\b/Refs #$n/Ig" body.md
              grep -q "Refs #$n" body.md || printf '\nRefs #%s\n' "$n" >> body.md
            else
              grep -q "Closes #$n" body.md || printf '\nCloses #%s\n' "$n" >> body.md
            fi
            guard_standing
            limit_body
            # If another run opened it in the meantime, that is a pass, not a failure.
            gh api "repos/$REPO/pulls" -f base=main -f head="$BRANCH" -f title="$title" -F body=@body.md --silent || {
              sleep 3
              if [ "$(open_prs 'length')" != "0" ]; then
                echo "PR for $BRANCH was opened by another run"
              elif [ "$(gh api "repos/$REPO/compare/main...$BRANCH" --jq .ahead_by 2>/dev/null)" = "0" ]; then
                # Muse creates its branch from main a second before its first commit: nothing to open yet, the next push opens
                # it (Nov 15: each such run failed and mailed Ryan).
                echo "branch $BRANCH has no commits ahead of main yet: no pull request on this push"
              else
                exit 1
              fi
            }
          else
            # A later push from a runner (codex/, muse/, work/) refreshes the text, so the PR describes the newest run
            # (issue 357: PR 543 kept a first run's report after a second run replaced it). opus/ PR bodies are
            # written by hand with their evidence and are never overwritten.
            case "$BRANCH" in
              opus/*) echo "PR already open for $BRANCH" ;;
              *)
                pr=$(open_prs '.[0].number')
                # Issue 1135: when the Board has set the open body to "Refs #N" with no closing word, keep Refs on refresh
                # (a later run or a main merge used to append "Closes #N" again and close a multi-run issue early).
                keep_refs=""
                if [ -n "$n" ]; then
                  old_body=$(gh api "repos/$REPO/pulls/$pr" --jq .body 2>/dev/null || true)
                  if printf '%s\n' "$old_body" | grep -qE "\bRefs:?[[:space:]]+#$n\b" &&
                     ! printf '%s\n' "$old_body" | grep -qiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#$n\b"; then
                    keep_refs=1
                  fi
                fi
                body=$(printf '%s\n' "$TITLE" | tail -n +2)
                printf '%s\n\nRefreshed from the latest push to branch %s. The Board reviews and merges.\n' "$body" "$BRANCH" > body.md
                if [ -n "$keep_refs" ]; then
                  sed -i -E "s/\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#$n\b/Refs #$n/Ig" body.md
                  grep -q "Refs #$n" body.md || printf '\nRefs #%s\n' "$n" >> body.md
                fi
                # standing issues are never closed by a merge, same as above
                case " $STANDING " in *" $n "*)
                  sed -i -E "s/\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#$n\b/Refs #$n/Ig" body.md
                  grep -q "Refs #$n" body.md || printf '\nRefs #%s\n' "$n" >> body.md ;;
                *) [ -z "$n" ] || grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?|refs):?[[:space:]]+#$n\b" body.md || printf '\nCloses #%s\n' "$n" >> body.md ;;
                esac
                guard_standing
                limit_body
                gh api -X PATCH "repos/$REPO/pulls/$pr" -F body=@body.md --silent && echo "PR $pr text refreshed"
                ;;
            esac
          fi
